# Reports unit test coverage and complexity for the TypeScript packages and
# the Rust crates. It reports only: no number fails a job, and no job here is
# required by the "Protect main" ruleset. The checks that gate a pull request
# are in packages-ci.yml and rust-ci.yml.
#
# `ts` and `rust` run scripts/quality-report.sh, whose header says what it
# measures, and write its tables to their job summary: first a row per
# package or crate with its test result, line coverage and complexity
# findings, then the coverage and the functions over a complexity threshold
# in full. A failing test is named in the summary and leaves the job green.
#
# `coverage` totals both languages with octocov (.octocov.yml) and writes the
# total to its job summary, beside the change from main. A run on main stores
# its report as a workflow artifact, which later runs compare with.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: reports

on:
  pull_request:
    paths:
      - packages/**
      - scripts/quality-report.sh
      - .octocov.yml
      - .oxlintrc.complexity.json
      - .github/workflows/reports.yml
      - .github/actions/rust-*/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: the tests resolve the workspace packages through dist/.
      - name: Build
        run: pnpm run build

      - name: Report
        run: scripts/quality-report.sh ts >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ts
          path: packages/coverage/ts.lcov
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy llvm-tools-preview

      # A key of its own: an instrumented build shares nothing with rust-ci.yml's.
      - uses: ./.github/actions/rust-build-cache
        with:
          key: coverage

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Report
        run: scripts/quality-report.sh rust >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: packages/coverage/rust.lcov
          if-no-files-found: error

  coverage:
    needs: [ts, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # octocov reads main's report from a workflow artifact.
      actions: read
    steps:
      # octocov resolves the paths in the lcov files against the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: packages/coverage
          merge-multiple: true

      # The rust job's lcov names files by their absolute path on its runner,
      # which is this runner's checkout path too.
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.5
