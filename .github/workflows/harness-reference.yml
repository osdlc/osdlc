# Checks the harness reference in packages/corpora/harness-reference/, and the
# packages that read the file compiled from it.
#
# The validator is built from packages/ts/corpus-schema with
# tools/build-corpus-schema.sh; the corpus takes it from the workspace.
#
# check: the corpus must validate with no errors and no warnings. Its own check
# then validates it again, runs the lint rules that compare records, the tests
# of capture, lint and compile, and the typecheck.
#
# The compiled file @osdlc/harness-knowledge ships is not committed. Its build
# compiles it from this corpus, so a corpus change reaches the packages that read
# it: the build and tests of harness-knowledge and of every package that depends
# on it run here. When the compiled values differ from the version on npm, a
# changeset naming @osdlc/harness-knowledge must be in the pull request, since
# that is what releases the change (check:release).
#
# profiles.yml also validates this corpus, with every other one, and scans it
# for private data.
#
# The `paths` filter means this workflow does not run on every pull request,
# so it is not one to require in a ruleset.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: harness-reference

on:
  pull_request:
    paths:
      - 'packages/corpora/harness-reference/**'
      - 'packages/ts/harness-knowledge/**'
      - 'packages/ts/corpus-schema/**'
      - 'packages/ts/frontmatter-lossless/**'
      - 'packages/ts/markdown-link/**'
      - 'packages/ts/prettier-config/**'
      - 'packages/ts/tsconfig/**'
      - 'tools/build-corpus-schema.sh'
      - 'tools/validate-strict.sh'
      - 'tools/validator.sh'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/harness-reference.yml'
  push:
    branches: [main]
    paths:
      - 'packages/corpora/harness-reference/**'
      - 'packages/ts/harness-knowledge/**'
      - 'packages/ts/corpus-schema/**'
      - 'packages/ts/frontmatter-lossless/**'
      - 'packages/ts/markdown-link/**'
      - 'packages/ts/prettier-config/**'
      - 'packages/ts/tsconfig/**'
      - 'tools/build-corpus-schema.sh'
      - 'tools/validate-strict.sh'
      - 'tools/validator.sh'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/harness-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-reference-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build corpus-schema
        run: sh tools/build-corpus-schema.sh

      # Fails on a warning as well as on an error.
      - name: Validate the corpus
        run: sh tools/validate-strict.sh packages/corpora/harness-reference/corpus

      - name: Validate, lint, test and typecheck
        run: pnpm --filter harness-reference run check

      # The build compiles the corpus into harness-knowledge's data/, then builds
      # every package that depends on harness-knowledge.
      - name: Build harness-knowledge and its dependents
        run: pnpm --filter '...@osdlc/harness-knowledge...' --if-present run build

      - name: Test harness-knowledge and its dependents
        run: pnpm --filter '...@osdlc/harness-knowledge' --no-bail --if-present run test

      - name: A corpus change that changes the data carries a changeset
        if: github.event_name == 'pull_request'
        run: pnpm --filter @osdlc/harness-knowledge run check:release
