# Checks the harness reference in packages/corpora/harness-reference/, and the
# compiled file @osdlc/harness-knowledge ships from it, in
# packages/ts/harness-knowledge/data/.
#
# The validator is built from packages/ts/corpus-schema with
# tools/build-corpus-schema.sh; the corpus takes it from the workspace.
#
# check: the corpus must validate with no errors and no warnings. Its own check
# then validates it again, runs the lint rules that compare records, the tests
# of capture, lint and compile, and the typecheck.
#
# The compiled data must be what the corpus compiles to at the commit the data
# names, byte for byte. A corpus change that the data does not hold yet is a
# warning, not a failure: the data is rewritten once the change is on main, so
# its links can name that commit (see packages/ts/harness-knowledge/README.md).
# Data that still names osdlc/skillwright, where the corpus was, must hold what
# the corpus here compiles to apart from where its links point.
#
# profiles.yml also validates this corpus, with every other one, and scans it
# for private data.
#
# The `paths` filter means this workflow does not run on every pull request,
# so it is not one to require in a ruleset.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: harness-reference

on:
  pull_request:
    paths:
      - 'packages/corpora/harness-reference/**'
      - 'packages/ts/harness-knowledge/data/**'
      - 'packages/ts/harness-knowledge/scripts/**'
      - 'packages/ts/corpus-schema/**'
      - 'packages/ts/frontmatter-lossless/**'
      - 'packages/ts/markdown-link/**'
      - 'packages/ts/prettier-config/**'
      - 'packages/ts/tsconfig/**'
      - 'tools/build-corpus-schema.sh'
      - 'tools/validate-strict.sh'
      - 'tools/validator.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/harness-reference.yml'
  push:
    branches: [main]
    paths:
      - 'packages/corpora/harness-reference/**'
      - 'packages/ts/harness-knowledge/data/**'
      - 'packages/ts/harness-knowledge/scripts/**'
      - 'packages/ts/corpus-schema/**'
      - 'packages/ts/frontmatter-lossless/**'
      - 'packages/ts/markdown-link/**'
      - 'packages/ts/prettier-config/**'
      - 'packages/ts/tsconfig/**'
      - 'tools/build-corpus-schema.sh'
      - 'tools/validate-strict.sh'
      - 'tools/validator.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/harness-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-reference-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: the data check compiles the corpus as it was at the
      # commit the data names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build corpus-schema
        run: sh tools/build-corpus-schema.sh

      # Fails on a warning as well as on an error.
      - name: Validate the corpus
        run: sh tools/validate-strict.sh packages/corpora/harness-reference/corpus

      - name: Validate, lint, test and typecheck
        run: pnpm --filter harness-reference run check

      - name: The compiled data matches the corpus
        run: pnpm --filter @osdlc/harness-knowledge run check:data
