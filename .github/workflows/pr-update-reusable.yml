# Keeps a repository's open pull requests up to date with its default branch.
# A reusable workflow: it wraps the pr-update action
# (packages/gh-actions/pr-update) with the GitHub App token, the checkout, the
# git identity, the `/pr-update` comment and the concurrency rules, so a
# repository needs only a short caller that says when it runs.
# packages/gh-actions/pr-update/README.md shows the caller; osdlc/osdlc's
# pr-update.yml is one.
#
# What it does: merges the default branch into each open PR branch (no
# force-push with the merge strategy). A conflict the built-in resolvers cannot
# clear goes to a headless agent repair; one it cannot clear either is labelled
# needs-manual-update and commented on once.
#
# Which event started the caller decides what one run does:
#   schedule            every eligible open PR
#   workflow_dispatch   every eligible PR, or the one in `pr`; `dry-run` pushes
#                       nothing. Refused from any branch but the default.
#   issue_comment       `/pr-update` or `/pr-update retry` as the first line of
#                       a PR comment from a trigger user: that PR now. Any
#                       other comment ends at the gate.
# The caller passes its own workflow_dispatch inputs on as `pr` and `dry-run`.
#
# Concurrency: two jobs.
#   gate      decides what this event asks for. Cheap, no secrets.
#   update    the work, with cancel-in-progress: false, so a run that is
#             already updating PRs (or paying for an agent repair) is never
#             cancelled. At most one run updates and one waits per group;
#             GitHub replaces an older waiting run with the newer one, which
#             coalesces bursts again. All-PR runs share pr-update-run. A
#             comment run for one PR uses pr-update-pr-<n>, so it does not queue
#             behind a long all-PR run. Two runs can then push the same branch
#             at once; pushes are fast-forward (merge strategy), so the loser is
#             rejected, its PR is reported failed, and the next run retries at
#             the new head.
#
# Token: the pushes need a GitHub App token, not GITHUB_TOKEN, or CI would not
# start on the PR. The App must be installed on the calling repository with
# repository permissions Contents: write, Pull requests: write, Issues: write
# (labels, comments, reactions) and Workflows: write. Without Workflows,
# pushing a merge that brings the default branch's .github/workflows changes
# into a PR branch is rejected by GitHub ("refusing to allow a GitHub App to
# create or update workflow ... without `workflows` permission"); that PR ends
# `failed`. Without Pull requests/Issues write, pushes work but labels and
# comments only warn. `permission-*` below can only narrow what the App was
# granted. The commits are authored as the App's bot user.
#
# The action is taken from osdlc/osdlc's main, and a comment, a schedule and a
# dispatch all run the caller's default branch, so a pull request cannot change
# what runs with the App token and the API key.
#
# No loop: a caller listens for no push or pull_request events, and the bot's
# comments and reactions never start the comment trigger (a comment from the
# App is not from a trigger user).
name: pr-update-reusable

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App that pushes to the PR branches.
        type: string
        required: true
      environment:
        description: >-
          The environment that holds the App's key, RELEASE_PLZ_APP_PRIVATE_KEY.
          Empty when the key is a repository or organization secret.
        type: string
        default: ''
      pr:
        description: One PR number to update, from the caller's workflow_dispatch. Empty updates every eligible PR.
        type: string
        default: ''
      dry-run:
        description: Measure and report, push nothing. From the caller's workflow_dispatch.
        type: boolean
        default: false
      trigger-users:
        description: Logins that may use the /pr-update comment, comma separated.
        type: string
        default: ''
      trigger-associations:
        description: >-
          Author associations that may use the /pr-update comment (OWNER,
          MEMBER, COLLABORATOR), comma separated. Empty for none.
        type: string
        default: ''
      strategy:
        description: merge (never rewrites history, no force-push) or rebase.
        type: string
        default: merge
      repair-agent:
        description: Agent that repairs a conflict no resolver claims; empty disables repair. See the action.
        type: string
        default: claude
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY:
        description: >-
          The App's private key. Pass it by name even when only `environment`
          holds it; `update` then reads the environment's value. A reusable
          workflow reads an environment secret the caller does not pass as an
          empty string
          (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows).
        required: true
      ANTHROPIC_API_KEY:
        description: API key for the claude repair. Left out, a conflict is reported and left for a person.
        required: false

permissions: {}

jobs:
  gate:
    if: >-
      (github.event_name != 'workflow_dispatch'
          || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      && (github.event_name != 'issue_comment'
          || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/pr-update')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.gate.outputs.go }}
      pr: ${{ steps.gate.outputs.pr }}
      args: ${{ steps.gate.outputs.args }}
      dry-run: ${{ steps.gate.outputs.dry-run }}
      comment-id: ${{ steps.gate.outputs.comment-id }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          DISPATCH_DRY_RUN: ${{ inputs.dry-run }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_USERS: ${{ inputs.trigger-users }}
          TRIGGER_ASSOCIATIONS: ${{ inputs.trigger-associations }}
        run: |
          set -euo pipefail
          go=true pr="" args="" dry=false comment_id=""
          case "$EVENT" in
            workflow_dispatch)
              dry="$DISPATCH_DRY_RUN"
              if [ -n "$DISPATCH_PR" ]; then
                [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
                pr="$DISPATCH_PR"
              fi
              ;;
            issue_comment)
              # Only the first line counts, and it must be the whole command, so
              # quoted text, code blocks and a mention in prose do nothing.
              first="${COMMENT_BODY%%$'\n'*}"
              first="${first%$'\r'}"
              go=false
              if [[ "$first" =~ ^/pr-update([[:space:]]+retry)?[[:space:]]*$ ]]; then
                ok=false
                if [ -n "$COMMENT_USER" ]; then
                  case ",$TRIGGER_USERS," in *",$COMMENT_USER,"*) ok=true ;; esac
                fi
                if [ -n "$TRIGGER_ASSOCIATIONS" ]; then
                  case ",$TRIGGER_ASSOCIATIONS," in *",$COMMENT_ASSOC,"*) ok=true ;; esac
                fi
                if [ "$ok" = true ]; then
                  go=true pr="$ISSUE_NUMBER" comment_id="$COMMENT_ID"
                  [ -z "${BASH_REMATCH[1]}" ] || args="--retry-failed"
                fi
              fi
              ;;
            # A schedule, or any other event the caller chose: every eligible PR.
            *) ;;
          esac
          {
            echo "go=$go"
            echo "pr=$pr"
            echo "args=$args"
            echo "dry-run=$dry"
            echo "comment-id=$comment_id"
          } >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Bounds one run, repairs included. A run cut off here is safe: nothing is
    # half pushed, the failed-attempt record is saved anyway, and the next run
    # finds the PRs it finished up to date (a cheap no-op).
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ needs.gate.outputs.pr != '' && format('pr-update-pr-{0}', needs.gate.outputs.pr) || 'pr-update-run' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # `required` only checks that the caller passes the secret, not that it
      # has a value.
      - name: Check the App key
        env:
          APP_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_KEY" ]; then
            echo "::error::RELEASE_PLZ_APP_PRIVATE_KEY is empty. The caller must pass it by name under \`secrets:\`, and the repository, the organization or the \`environment\` input's environment must hold it."
            exit 1
          fi

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: React to the comment
        if: needs.gate.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ needs.gate.outputs.comment-id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true

      # The default branch, never the PR. The action pushes merge commits from
      # this checkout, so it is made with the App token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set the git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"

      - id: update
        uses: osdlc/osdlc/packages/gh-actions/pr-update@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ needs.gate.outputs.pr }}
          dry-run: ${{ needs.gate.outputs.dry-run }}
          extra-args: ${{ needs.gate.outputs.args }}
          strategy: ${{ inputs.strategy }}
          repair-agent: ${{ inputs.repair-agent }}

      - name: React with the result
        if: always() && needs.gate.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ needs.gate.outputs.comment-id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          reaction='+1'
          [ "$JOB_STATUS" = success ] || reaction='-1'
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content="$reaction" --silent || true
