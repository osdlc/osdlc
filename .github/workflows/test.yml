# The `test` check that the "Protect main" ruleset requires on every pull
# request. Generated: this file is written by sksizer/dev's
# scripts/sdlc-mirror/assemble.ts on each release, so edit
# scripts/sdlc-mirror/templates/product/github/ there, not here.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the published plugin packs
        run: node .github/scripts/validate.mjs
