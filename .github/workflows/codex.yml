# Mention @codex in a pull request comment, an inline review comment or a
# review and Codex replies on the pull request. A comment that starts with
# `@codex review [focus]` gets a code review of the pull request instead.
# The work is the codex-pr action (packages/gh-actions/codex-pr); this file only
# says when it runs and with what. See that action's README for its limits.
#
# `@codex /<plugin>:<skill> [args]` runs any installed skill and posts its output;
# add `--apply` and the action commits the changes and pushes them to the pull
# request branch with a GitHub App token (osdlc-release, the release-plz
# environment's secrets, as in pr-update.yml). The release-plz environment only
# deploys from main, and only issue_comment runs are on main (inline review
# comments and reviews run on refs/pull/N/merge), so the push token exists only
# in the second job; the first one covers the other two events, read-only.
#
# Only sksizer can trigger it: the job's `if` checks the author before a
# runner starts. The action is taken from main, never from the pull request,
# so a pull request cannot change what runs with the API key.
name: codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  # Inline review comments and reviews: no environment, so no push token; a
  # skill runs read-only and `--apply` is refused with a comment.
  codex:
    if: >-
      (github.event.comment.user.login || github.event.review.user.login) == 'sksizer'
      && contains(github.event.comment.body || github.event.review.body, '@codex')
      && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: osdlc/osdlc/packages/gh-actions/codex-pr@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  # Comments on the pull request conversation: in the release-plz environment
  # (main only) to mint the push token. If the token cannot be minted the step
  # is skipped over and the action runs read-only.
  codex-comment:
    if: >-
      (github.event.comment.user.login || github.event.review.user.login) == 'sksizer'
      && contains(github.event.comment.body || github.event.review.body, '@codex')
      && github.event_name == 'issue_comment'
      && github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-plz
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Get a GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: osdlc/osdlc/packages/gh-actions/codex-pr@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          push-token: ${{ steps.app-token.outputs.token }}
          git-user-name: osdlc-release[bot]
          git-user-email: osdlc-release[bot]@users.noreply.github.com
