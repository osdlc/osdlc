# Mention @codex in a pull request comment, an inline review comment or a
# review and Codex replies on the pull request. A comment that starts with
# `@codex review [focus]` gets a code review of the pull request instead.
# The work is the codex-pr action (packages/gh-actions/codex-pr); this file only
# says when it runs and with what. See that action's README for its limits.
#
# `@codex /<plugin>:<skill> [args]` runs any installed skill and posts its output.
# Add `--apply` and the agent may edit files: the first job (no environment, no
# push token) turns its edits into a patch artifact, and the second job (the
# pr-agent environment, which holds the osdlc-release App secrets) checks the
# patch, applies it to a fresh checkout, commits and pushes it to the pull
# request branch with an App token, so CI runs. See packages/gh-actions/pr-apply.
#
# Only sksizer can trigger it: the job's `if` checks the author before a
# runner starts. The action is taken from main, never from the pull request,
# so a pull request cannot change what runs with the API key.
name: codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  codex:
    if: >-
      (github.event.comment.user.login || github.event.review.user.login) == 'sksizer'
      && contains(github.event.comment.body || github.event.review.body, '@codex')
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      apply-patch: ${{ steps.agent.outputs.apply-patch }}
    steps:
      - id: agent
        uses: osdlc/osdlc/packages/gh-actions/codex-pr@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  # Only for --apply runs that changed files. The agent never runs here.
  codex-push:
    needs: codex
    if: needs.codex.outputs.apply-patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-agent
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # If this fails (environment or secrets missing) the next step still runs
      # and posts the agent's output with the reason nothing was pushed.
      - name: Get a GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: osdlc/osdlc/packages/gh-actions/pr-apply@main
        with:
          agent: codex
          push-token: ${{ steps.app-token.outputs.token }}
          git-user-name: osdlc-release[bot]
          git-user-email: osdlc-release[bot]@users.noreply.github.com
