# Temporary: finds why claude-code-action fails on this repo. Delete after use.
name: claude-auth-debug
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 20 --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash"'
          show_full_output: true
