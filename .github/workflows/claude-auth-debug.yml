# Temporary: finds why claude-code-action fails on this repo. Delete after use.
name: claude-auth-debug
on:
  push:
    branches: [tmp/claude-auth-debug]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""
          - '--max-turns 20 --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash"'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with just: hi"
          claude_args: ${{ matrix.args }}
          show_full_output: true
