# Answers questions on pull requests. Mention @claude in a pull request
# comment, an inline review comment or a review, and Claude replies in a
# comment on the pull request.
#
# Only sksizer can trigger it: the job's `if` checks the comment's author
# before a runner starts, so nobody else's comment spends a runner minute or
# a token. Comments on issues are skipped too.
#
# The steps are the composite actions in packages/gh-actions/: claude-setup
# installs a pinned Claude Code and the craft plugin, and claude-pr-answer
# runs `claude -p` with read-only tools and posts the answer, or the error.
# The workflow checks out the default branch and runs the actions from it, and
# checks the pull request out under pr/, so a pull request cannot change the
# action that runs with the API key.
#
# Auth is ANTHROPIC_API_KEY, a Claude Console API key that bills to the org's
# API credits.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  answer:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == 'sksizer'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.comment.user.login == 'sksizer'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'sksizer'
        && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0

      - uses: ./packages/gh-actions/claude-setup
        with:
          marketplaces: https://github.com/osdlc/marketplace.git
          plugins: craft@osdlc

      - uses: ./packages/gh-actions/claude-pr-answer
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ github.event.issue.number || github.event.pull_request.number }}
          request: ${{ github.event.comment.body || github.event.review.body }}
          source-url: ${{ github.event.comment.html_url || github.event.review.html_url }}
          working-directory: pr
