# Answers questions on pull requests. Mention @claude in a pull request
# comment, an inline review comment or a review, and Claude replies in a
# comment on the pull request.
#
# A comment that starts with `@claude review` runs the craft plugin's
# /craft:code-review on the pull request against its base branch instead, and
# posts the findings. Text after `review` is passed on as the focus. A
# finished review opens with "Claude review done" and ends with the marker
# `<!-- claude-review: done head=<sha> -->`.
#
# Only sksizer can trigger it: the job's `if` checks the comment's author
# before a runner starts, so nobody else's comment spends a runner minute or
# a token. Comments on issues are skipped too.
#
# This runs the Claude Code CLI directly (`claude -p`) rather than
# anthropics/claude-code-action, whose @claude path was refused by the API
# with billing_error while the CLI with the same credential was not. The
# steps are plain shell, so a failure shows its real error in the log.
#
# Claude only reads and answers. `--allowedTools` grants file reading, sub-agents,
# skills, read-only git and gh commands, and node for the scripts the craft
# skills bundle; nothing that edits, commits, pushes or comments. The last
# step posts Claude's answer, or the error when there is none.
#
# Keys: the ANTHROPIC_API_KEY secret holds one Claude Console API key, or
# several separated by newlines, commas or spaces; they bill to the org's API
# credits. They are tried in order, and only an authentication failure moves
# on to the next, leaving a warning on the run that names the dead key's
# position. To rotate: set the secret to "new old", then later to "new". The
# CLI version is pinned below.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

env:
  CLAUDE_CODE_VERSION: 2.1.319

jobs:
  answer:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == 'sksizer'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.comment.user.login == 'sksizer'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'sksizer'
        && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
      REQUEST: ${{ github.event.comment.body || github.event.review.body }}
      SOURCE_URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
    steps:
      # The job's `if` can only test for the text "@claude". This step drops
      # code blocks, inline code and quoted lines first, so a comment that only
      # quotes "@claude" (a table of findings, say) stops here without
      # installing anything or spending a token.
      - name: Check for a real mention
        id: mention
        run: |
          if printf '%s\n' "$REQUEST" \
            | perl -0777 -pe 's/```.*?```//gs; s/`[^`\n]*`//g; s/^[ \t]*>.*$//mg' \
            | grep -qE '(^|[^[:alnum:]_/.-])@claude([^[:alnum:]_-]|$)'; then
            echo "real=1" >> "$GITHUB_OUTPUT"
          else
            echo "Only quoted or code mentions of @claude; nothing to do."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mention.outputs.real == '1'
        with:
          fetch-depth: 0

      - name: Check out the pull request
        if: steps.mention.outputs.real == '1'
        run: gh pr checkout "$PR"

      - name: Install Claude Code and the craft plugin
        if: steps.mention.outputs.real == '1'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" plugin marketplace add https://github.com/osdlc/marketplace.git
          "$HOME/.local/bin/claude" plugin install craft@osdlc

      - name: Ask Claude
        id: claude
        if: steps.mention.outputs.real == '1'
        env:
          # One key or several, tried in order; see "Keys" at the top of this file.
          KEYS: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # `@claude review [focus]` at the start of the comment runs the review skill.
          if printf '%s\n' "$REQUEST" | head -n 1 | grep -qE '^[[:space:]]*@claude[[:space:]]+review([[:space:]]|$)'; then
            echo "mode=review" >> "$GITHUB_OUTPUT"
            focus=$(printf '%s\n' "$REQUEST" | sed -E '1s/^[[:space:]]*@claude[[:space:]]+review[[:space:]]*//')
            base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
            prompt="Review pull request #$PR in $REPO by running the /craft:code-review skill with base origin/$base.
          The pull request branch is checked out in the current directory, and origin/$base is fetched.
          Review only what this branch changes against origin/$base (\`git diff origin/$base...HEAD\`); read the changed files in full where needed.
          Your final message is posted to the pull request as a comment: GitHub-flavored markdown, findings in order of severity,
          each with its file:line, the concrete failure and the fix. Say so plainly if there are no findings.
          You cannot edit files, commit or post; the workflow posts your final message.
          ${focus:+Focus requested by the reviewer: $focus}"
          else
            echo "mode=answer" >> "$GITHUB_OUTPUT"
            prompt="You are answering a question on pull request #$PR in $REPO.
          The pull request branch is checked out in the current directory.
          Use \`gh pr view $PR --comments\` and \`gh pr diff $PR\` for its description, discussion and diff.
          Answer only what is asked, in GitHub-flavored markdown, as your final message.
          You cannot edit files, commit or post; the workflow posts your final message.

          The request, from $SOURCE_URL:

          $REQUEST"
          fi
          status=1
          tried=0
          keys=()
          while IFS= read -r k; do
            if [ -n "$k" ]; then keys+=("$k"); fi
          done < <(printf '%s\n' "$KEYS" | tr ',' '\n' | tr -s '[:space:]' '\n')
          for key in "${keys[@]}"; do echo "::add-mask::$key"; done
          for key in "${keys[@]}"; do
            tried=$((tried + 1))
            n=$tried
            set +e
            ANTHROPIC_API_KEY="$key" claude -p "$prompt" \
              --output-format json \
              --max-turns 60 \
              --allowedTools "Read,Glob,Grep,Skill,Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(node:*)" \
              --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git commit:*),Bash(git push:*),Bash(gh pr comment:*)" \
              < /dev/null > result.json
            status=$?
            set -e
            echo "key $n: exit $status"
            jq '{is_error, subtype, num_turns, total_cost_usd, api_error_status, result}' result.json || cat result.json
            if [ "$status" -eq 0 ] && jq -e '.is_error == false' result.json > /dev/null 2>&1; then
              break
            fi
            # Only an authentication failure moves on to the next key.
            # The text check looks only at a run that never got a turn, or at
            # output that is not JSON, so tool inputs Claude tried cannot match.
            auth='authentication_error|invalid x-api-key|invalid api key'
            if jq -e --arg re "$auth" '.api_error_status == 401
                or (.is_error == true and (.num_turns // 0) <= 1 and ((.result // "") | test($re; "i")))' \
                result.json > /dev/null 2>&1 \
              || { ! jq -e . result.json > /dev/null 2>&1 && grep -qiE "$auth" result.json; }; then
              echo "::warning::key $n in ANTHROPIC_API_KEY failed authentication; remove it from the secret"
              continue
            fi
            break
          done
          if [ "$tried" -eq 0 ]; then
            jq -n '{is_error: true, result: "No ANTHROPIC_API_KEY secret is set"}' | tee result.json
          fi
          exit "$status"

      - name: Post the answer
        if: always() && steps.claude.outcome != 'skipped'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.claude.outputs.mode }}
        run: |
          # Every comment ends with a marker, so a reader (or a script) can
          # tell the run is finished: `<!-- claude-review: done head=<sha> -->`,
          # or `failed`; answers use `claude-answer`. A review also opens with
          # a visible "Claude review done" line naming the commit it covered.
          head=$(git rev-parse HEAD)
          kind=claude-${MODE:-answer}
          if [ -s result.json ] && jq -e '.is_error == false' result.json > /dev/null 2>&1; then
            outcome=done
            {
              if [ "$MODE" = review ]; then
                echo "**Claude review done** for ${head:0:7}. The findings are below; respond to them now."
                echo
              fi
              jq -r '.result' result.json
            } > answer.md
          else
            outcome=failed
            {
              if [ "$MODE" = review ]; then
                echo "**Claude review failed** for ${head:0:7}."
              else
                echo "Claude could not answer. [Run log]($RUN_URL)"
              fi
              echo
              echo '```'
              jq -r '.result // "no result"' result.json 2>/dev/null || echo "no result"
              echo '```'
            } > answer.md
          fi
          {
            echo
            echo "<sub>[Run log]($RUN_URL)</sub>"
            echo
            echo "<!-- $kind: $outcome head=$head -->"
          } >> answer.md
          gh pr comment "$PR" --body-file answer.md
