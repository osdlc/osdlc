# The perf gate. On a pull request it runs the benchmarks of the packages the
# change touches (and of the packages that depend on them) on the base and on
# the head, in this one job, and fails when a gated benchmark's best round is
# more than THRESHOLD (scripts/perf-gate.ts) slower on the head, in a first
# pass and again in a confirmation pass that reruns only the suspect
# benchmarks (a name filter per runner), and not at all for an accepted PR. Both sides share one runner, and their runs alternate, so the speed
# of the runner cancels out. bench/README.md says what is gated and how a
# package adds a benchmark; scripts/perf-gate.ts is the gate.
#
# A deliberate slowdown goes through with the `perf-accepted` label and a line
# `Perf-accepted: <reason>` in the pull request body; the confirmation pass is
# then skipped. The job reruns when the label or the body changes.
#
# The job always runs and reports, like the other checks, so it can be made a
# required check; when no package with benchmarks is affected it stops after
# the pick.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: perf-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in progress. A label or title edit waits for it
# instead, so an unrelated label does not throw away an hour of benchmarking.
concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event.action == 'opened' || github.event.action == 'reopened' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  gate:
    name: perf gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A pull request checks out its merge commit. Depth 2 brings in its
      # first parent, the base branch tip, which is the base side. A manual
      # run compares HEAD with its parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Test the gate and the corpus
        run: node --test scripts/perf-gate.test.ts bench/corpus/corpus.test.ts

      - name: Pick the packages to compare
        id: pick
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          picked="$(node scripts/perf-gate.ts pick . --changed "$RUNNER_TEMP/changed.txt")"
          echo "picked: $picked"
          if [ "$picked" = '[]' ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.any == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pick.outputs.any == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - uses: ./.github/actions/rust-toolchain
        if: steps.pick.outputs.any == 'true'

      - uses: ./.github/actions/rust-build-cache
        if: steps.pick.outputs.any == 'true'

      # The base side is a second checkout of the first parent.
      - name: Check out the base
        if: steps.pick.outputs.any == 'true'
        run: git worktree add "$RUNNER_TEMP/base" HEAD^1

      - name: Install the head
        if: steps.pick.outputs.any == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the base
        if: steps.pick.outputs.any == 'true'
        working-directory: ${{ runner.temp }}/base
        run: pnpm install --frozen-lockfile

      # PERF_BODY and PERF_LABELS reach the script as environment variables,
      # never spliced into the shell.
      - name: Compare base and head
        if: steps.pick.outputs.any == 'true'
        env:
          PERF_BODY: ${{ github.event.pull_request.body }}
          PERF_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >-
          node scripts/perf-gate.ts "$RUNNER_TEMP/base" . --changed "$RUNNER_TEMP/changed.txt"
          --rounds 3 --confirm-rounds 3 --out "$RUNNER_TEMP/perf"

      - name: Keep the numbers
        if: ${{ !cancelled() && steps.pick.outputs.any == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-gate
          path: ${{ runner.temp }}/perf
          if-no-files-found: ignore
