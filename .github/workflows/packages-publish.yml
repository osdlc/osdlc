# Releases the libraries under packages/ts/ with Changesets on every push to
# main: the full packages-ci.yml matrix, then ts-packages-release.yml, which
# opens the Version Packages pull request or publishes the versions not on
# npm yet. Windows tier 2 runs on the same push from
# packages-windows-tier2.yml, in its own run, so it neither gates a release
# nor holds this workflow's concurrency group. packages/README.md describes
# the release steps.
#
# npm auth is trusted publishing (OIDC) only, with provenance. npm checks the
# calling workflow, so each package's trusted publisher on npmjs.com names
# this file, packages-publish.yml, and the file keeps its name. The `release`
# job grants `id-token: write`, which ts-packages-release.yml gives only to
# its `publish` job.
#
# The Version Packages pull request is opened as the osdlc-release GitHub App,
# whose key is in the release-plz environment. The `release` job passes the
# key by name; ts-packages-release.yml says why.
name: packages-publish

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: packages-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/packages-ci.yml
    with:
      skip-windows-tier2: true

  release:
    needs: verify
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/ts-packages-release.yml
    with:
      app-client-id: Iv23liYTGAl78fzN8YWm
      # `version-packages` runs `changeset version`, refreshes pnpm-lock.yaml, stamps each CLI's
      # src/version.generated.ts, rebuilds wayfinder, then rewrites its
      # schema/config.json and its guide's `$schema` line for the new version,
      # and reruns the TypeScript-referenced conformance generators, since each
      # suite records its reference's version. It reads wayfinder's dist/ and
      # runs the conformance-suites command, so both are built first.
      version-prepare: pnpm --filter '@osdlc/wayfinder...' --filter '@osdlc/conformance-suites...' run build
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
