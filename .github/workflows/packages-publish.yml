# Releases the libraries under packages/ts/ with Changesets on every push to
# main.
#
# 1. `verify` runs the full packages-ci.yml matrix on the pushed commit.
# 2. `select-mode` asks Changesets what to do:
#    - `version`: changesets are pending. `version` opens or updates the one
#      "Version Packages" pull request, which bumps versions and writes the
#      CHANGELOGs.
#    - `publish`: no changesets, and some package version is not on npm yet.
#      This is the merge of the Version Packages pull request.
#    - `none`: nothing to do.
# 3. `pack` builds, runs check-packages.mjs and packs the tarballs.
# 4. `publish` publishes those tarballs, then pushes a `<name>@<version>` tag
#    and a GitHub release for each. A version already on npm is skipped, so a
#    re-run is safe.
#
# npm auth is trusted publishing (OIDC) only, with provenance. No npm token is
# stored. Each package's trusted publisher on npmjs.com names repository
# osdlc/osdlc and this file, packages-publish.yml, so the file keeps its name
# and the `publish` job stays in it. Only `publish` gets `id-token: write`.
#
# npm can only set up trusted publishing on a package that already exists. A
# new package needs a one-time placeholder publish and trusted-publisher setup
# by the owner first; `pack` stops the run while a package is not on npm.
#
# The Version Packages pull request is opened with GITHUB_TOKEN, so its CI runs
# wait for approval: select "Approve workflows to run" on the pull request.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be on.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: packages-publish

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: packages-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/packages-ci.yml

  select-mode:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted publishing cannot create a package. See the header.
      - name: Refuse a package that is not on npm yet
        run: |
          set -euo pipefail
          for manifest in packages/ts/*/package.json; do
            name="$(node -p "const p = require('./$manifest'); p.private ? '' : p.name")"
            [ -n "$name" ] || continue
            if ! npm view "$name" name >/dev/null 2>&1; then
              echo "::error::$name is not on npm yet. The owner publishes a placeholder once and sets up its trusted publisher. See packages/README.md."
              exit 1
            fi
          done

      - name: Build
        run: pnpm run build

      - name: Pack, publint, attw
        run: pnpm run check:packages

      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      # Tags and GitHub releases.
      contents: write
      # OIDC token for npm trusted publishing; provenance is attested with it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # pnpm 10 hands a tarball to `npm publish`, and npm 11.5.1 or later is
      # needed for trusted publishing. Node 24 bundles a newer npm today.
      - name: Ensure npm 11.5.1 or later
        run: |
          set -euo pipefail
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number)
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)
          ' "$(npm --version)"; then
            npm install -g npm@11.19.1
          fi
          echo "npm $(npm --version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
