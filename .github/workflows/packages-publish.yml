# Publishes one library from packages/ to npm when its tag is pushed. Generated:
# written by sksizer/dev's scripts/sdlc-mirror/assemble.ts, so edit
# scripts/sdlc-mirror/templates/hosted/github/ there, not here.
#
# Tag grammar: `<name>/vX.Y.Z` publishes the package in packages/*/<name> at
# version X.Y.Z, for example `command-seam/v0.4.0` for packages/ts/command-seam.
# The run fails when no directory or more than one matches the name. sksizer/dev's release tooling pushes the tag
# for a package copied from there; the owner pushes the tag for a package
# developed here (packages/README.md lists which is which). The tag version
# must equal the package.json version. Plain `vX.Y.Z` tags are sdlc's own and
# do not match.
#
# npm auth is trusted publishing (OIDC) only. Configure it per package on
# npmjs.com: Settings -> Trusted publisher, repository osdlc/osdlc, workflow
# packages-publish.yml. Trusted publishing can only be configured on a package
# that already exists, so the FIRST publish of each package is done by hand by
# the owner, approved with the owner's npm passkey (no token). This workflow
# refuses a package that is not on npm yet rather than trying.
#
# Only the `publish` job gets `id-token: write`. It publishes the exact tarball
# the `verify` job built and checked.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: packages-publish

on:
  push:
    tags: ['*/v*']

permissions:
  contents: read

concurrency:
  group: packages-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-packages.mjs --resolve-tag finds packages/*/<name>, refuses a
      # missing or ambiguous match and a version that differs from the tag,
      # and prints name=, dir= and version= lines.
      - name: Resolve the package from the tag
        id: pkg
        run: |
          set -euo pipefail
          node .github/scripts/check-packages.mjs --resolve-tag "${GITHUB_REF_NAME}" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build before test; see packages-ci.yml. `<name>...` also selects the
      # package's workspace dependencies, so one with a build step is built
      # first. (A path selector, `./packages/ts/x...`, does not do that.)
      - name: Typecheck, build, test, smoke
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          for script in typecheck build test smoke; do
            pnpm --filter "${NAME}..." --if-present run "$script"
          done

      - name: Pack, publint, attw
        id: pack
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/pack"
          node .github/scripts/check-packages.mjs --out "$OUT" "$DIR"
          TARBALL="$(ls "$OUT"/*.tgz)"
          echo "tarball=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm trusted publishing; provenance is attested with it.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: pack

      # npm 11.5.1 or later is required for trusted publishing; Node 24 bundles it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Refuse a first publish
        env:
          NAME: ${{ needs.verify.outputs.name }}
        run: |
          set -euo pipefail
          if ! npm view "$NAME" name >/dev/null 2>&1; then
            echo "::error::$NAME is not on npm yet. The first publish is done by hand, approved with the owner's npm passkey (no token), then trusted publishing is configured. See the header of this file."
            exit 1
          fi

      - name: Publish to npm
        env:
          # The ./ is needed: npm reads a bare `pack/x.tgz` as GitHub shorthand (owner/repo).
          TARBALL: ./pack/${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "npm $(npm --version)"
          npm publish "$TARBALL" --access public
