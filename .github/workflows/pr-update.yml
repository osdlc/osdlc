# Keeps open pull requests up to date with main. Every merge to main puts each
# open PR one commit further behind; this brings them forward with
# @osdlc/pr-update (packages/gh-actions/pr-update) by merging main into the PR
# branch (no force-push; the repo is squash-merge only, so the merge commit
# never reaches main). A conflict the built-in resolvers cannot clear goes to a
# headless claude repair; one it cannot clear either is labelled
# needs-manual-update and commented on once.
#
# When it runs
#   push to main        after a debounce (below)
#   schedule            every 6 hours, catches anything a push run missed
#   workflow_dispatch   all PRs now, or one PR (input `pr`); `dry-run` pushes nothing
#   issue_comment       `/pr-update` or `/pr-update retry` as the first line of
#                       a PR comment from a trigger user: that PR now, no debounce
#
# Debounce and concurrency: three jobs.
#   gate      decides what this event asks for. Cheap, no secrets.
#   debounce  push events only. Sleeps N minutes, in the group
#             pr-update-debounce with cancel-in-progress: true. A newer push
#             cancels the sleeping job of the older run, and a cancelled
#             debounce makes its run's `update` skip. So after a burst of
#             merges only the last run reaches `update`.
#   update    the work, with cancel-in-progress: false, so a run that is
#             already updating PRs (or paying for an agent repair) is never
#             cancelled. At most one run updates and one waits per group;
#             GitHub replaces an older waiting run with the newer one, which
#             coalesces bursts again. All-PR runs share pr-update-run. A
#             comment run for one PR uses pr-update-pr-<n>, so it does not queue
#             behind a long all-PR run. Two runs can then push the same branch
#             at once; pushes are fast-forward (merge strategy), so the loser is
#             rejected, its PR is reported failed, and the next run retries at
#             the new head.
#
# Token: the pushes need a GitHub App token, not GITHUB_TOKEN, or CI would not
# start on the PR. The App (osdlc-release, secrets in the release-plz
# environment) needs repository permissions Contents: write, Pull requests:
# write, Issues: write (labels, comments, reactions) and Workflows: write. Without
# Workflows, pushing a merge that brings main's .github/workflows changes into a
# PR branch is rejected by GitHub ("refusing to allow a GitHub App to create or
# update workflow ... without `workflows` permission"); that PR ends `failed`.
# Without Pull requests/Issues write, pushes work but labels and comments only
# warn. `permission-*` below can only narrow what the App was granted.
#
# No loop: a push to a PR branch is not a push to main, the workflow does not
# listen for pull_request events, and the bot's comments and reactions never
# start the comment trigger (a comment from the App is not from a trigger user).
name: pr-update

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: One PR number to update. Empty updates every eligible PR.
        required: false
        default: ""
      dry-run:
        description: Measure and report, push nothing.
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions: {}

env:
  # Minutes a push run waits before it updates anything.
  DEBOUNCE_MINUTES: "5"
  # Who may use the /pr-update comment: logins, comma separated; and author
  # associations (OWNER, MEMBER, COLLABORATOR), comma separated, empty for none.
  TRIGGER_USERS: sksizer
  TRIGGER_ASSOCIATIONS: ""

jobs:
  gate:
    if: >-
      github.repository == 'osdlc/osdlc'
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      && (github.event_name != 'issue_comment'
          || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/pr-update')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.gate.outputs.go }}
      debounce: ${{ steps.gate.outputs.debounce }}
      pr: ${{ steps.gate.outputs.pr }}
      args: ${{ steps.gate.outputs.args }}
      dry-run: ${{ steps.gate.outputs.dry-run }}
      comment-id: ${{ steps.gate.outputs.comment-id }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          DISPATCH_DRY_RUN: ${{ inputs.dry-run }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          go=true debounce=false pr="" args="" dry=false comment_id=""
          case "$EVENT" in
            push) debounce=true ;;
            schedule) ;;
            workflow_dispatch)
              dry="$DISPATCH_DRY_RUN"
              if [ -n "$DISPATCH_PR" ]; then
                [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
                pr="$DISPATCH_PR"
              fi
              ;;
            issue_comment)
              # Only the first line counts, and it must be the whole command, so
              # quoted text, code blocks and a mention in prose do nothing.
              first="${COMMENT_BODY%%$'\n'*}"
              first="${first%$'\r'}"
              go=false
              if [[ "$first" =~ ^/pr-update([[:space:]]+retry)?[[:space:]]*$ ]]; then
                ok=false
                case ",$TRIGGER_USERS," in *",$COMMENT_USER,"*) ok=true ;; esac
                if [ -n "$TRIGGER_ASSOCIATIONS" ]; then
                  case ",$TRIGGER_ASSOCIATIONS," in *",$COMMENT_ASSOC,"*) ok=true ;; esac
                fi
                if [ "$ok" = true ]; then
                  go=true pr="$ISSUE_NUMBER" comment_id="$COMMENT_ID"
                  [ -z "${BASH_REMATCH[1]}" ] || args="--retry-failed"
                fi
              fi
              ;;
          esac
          {
            echo "go=$go"
            echo "debounce=$debounce"
            echo "pr=$pr"
            echo "args=$args"
            echo "dry-run=$dry"
            echo "comment-id=$comment_id"
          } >> "$GITHUB_OUTPUT"

  debounce:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.debounce == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-update-debounce
      cancel-in-progress: true
    steps:
      - name: Wait for the burst to end
        run: sleep "$((DEBOUNCE_MINUTES * 60))"

  update:
    needs: [gate, debounce]
    # Run when debounce finished or did not apply. If a newer push cancelled it,
    # its result is `cancelled` and this run does nothing.
    if: >-
      !cancelled() && needs.gate.outputs.go == 'true'
      && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    runs-on: ubuntu-latest
    # Bounds one run, repairs included. A run cut off here is safe: nothing is
    # half pushed, the failed-attempt record is saved anyway, and the next run
    # finds the PRs it finished up to date (a cheap no-op).
    timeout-minutes: 60
    environment: release-plz
    concurrency:
      group: ${{ needs.gate.outputs.pr != '' && format('pr-update-pr-{0}', needs.gate.outputs.pr) || 'pr-update-run' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: React to the comment
        if: needs.gate.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ needs.gate.outputs.comment-id }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent || true

      # The default branch, never the PR, so a PR cannot change the action that
      # runs with the App token and the API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set the git identity
        run: |
          git config user.name "osdlc-release[bot]"
          git config user.email "osdlc-release[bot]@users.noreply.github.com"

      - id: update
        uses: ./packages/gh-actions/pr-update
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ needs.gate.outputs.pr }}
          dry-run: ${{ needs.gate.outputs.dry-run }}
          extra-args: ${{ needs.gate.outputs.args }}
          strategy: merge
          repair-agent: claude

      - name: React with the result
        if: always() && needs.gate.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ needs.gate.outputs.comment-id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          reaction='+1'
          [ "$JOB_STATUS" = success ] || reaction='-1'
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content="$reaction" --silent || true
