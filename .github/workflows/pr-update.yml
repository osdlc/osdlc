# Keeps open pull requests up to date with main. Every merge to main puts each
# open PR one commit further behind; this brings them forward with
# @osdlc/pr-update by merging main into the PR branch (no force-push; the repo
# is squash-merge only, so the merge commit never reaches main). A conflict the
# built-in resolvers cannot clear goes to a headless claude repair; one it
# cannot clear either is labelled needs-manual-update and commented on once.
#
# This file only says when it runs and for whom. The work is the reusable
# workflow pr-update-reusable.yml, which other repositories call too; it
# describes the gate, the concurrency groups and the App token.
#
# When it runs
#   schedule            once a night, see the cron below. Not on every push to
#                       main: each merge to main would push a merge commit to
#                       every open PR, and each push starts that PR's full CI,
#                       so one merge became a CI storm across every open PR.
#   workflow_dispatch   all PRs now, or one PR (input `pr`); `dry-run` pushes nothing
#   issue_comment       `/pr-update` or `/pr-update retry` as the first line of
#                       a PR comment from a trigger user: that PR now
#
# Token: the pushes are made as the osdlc-release GitHub App, whose key is in
# the release-plz environment. The job passes the key by name;
# pr-update-reusable.yml says why.
name: pr-update

on:
  schedule:
    - cron: "30 8 * * *" # 02:30 US Central standard time, 03:30 daylight
  workflow_dispatch:
    inputs:
      pr:
        description: One PR number to update. Empty updates every eligible PR.
        required: false
        default: ""
      dry-run:
        description: Measure and report, push nothing.
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr-update:
    # Not in a fork, where the schedule would run without the App.
    if: github.repository == 'osdlc/osdlc'
    permissions:
      contents: read
    uses: ./.github/workflows/pr-update-reusable.yml
    with:
      app-client-id: Iv23liYTGAl78fzN8YWm
      environment: release-plz
      pr: ${{ inputs.pr }}
      dry-run: ${{ inputs.dry-run == true }}
      trigger-users: sksizer
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
