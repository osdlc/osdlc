# Checks the libraries under packages/ts/ on every pull request. On a push to
# main, packages-publish.yml calls this workflow and releases only if it
# passes. The "Protect main" ruleset requires each `verify` job.
#
# Build runs before test: the examples import each package by its own name,
# and under Node that name resolves through `exports` to dist/.
#
# Bun is installed because some packages test with `bun:test`; others use
# Vitest, which runs on Node. Node runs the build, the smoke checks and the
# packed-tarball checks, so the Node matrix is what a consumer sees.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: packages

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Smoke the built packages under Node
        run: pnpm run smoke

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Pack, publint, attw
        run: pnpm run check:packages
