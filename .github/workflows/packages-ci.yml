# Checks the libraries under packages/ts/ on every pull request. On a push to
# main, packages-publish.yml calls this workflow and releases only if it
# passes. The "Protect main" ruleset requires each `verify` job.
#
# A pull request checks only the packages it changed and the packages that
# depend on them. The `changes` job picks them with
# scripts/affected-packages.ts, which says what counts as a change.
# A change to a shared input (this file, the lockfile, the root package.json)
# checks every package, and so does every run that is not a pull request,
# including the call from packages-publish.yml. The `verify` jobs always run
# and report, since the ruleset requires them; only their steps narrow. When
# no package is picked, they install and stop.
#
# Build runs first, before typecheck and test. Packages resolve each other
# (and their own name, in examples) through `exports`, which points at dist/,
# so a typecheck and a test need the build. A build also builds the workspace
# packages the picked ones depend on. Every package tests with Vitest on Node,
# so the Node matrix is what a consumer sees.
#
# `windows` runs path-guard on Windows, when path-guard is picked. A run that
# is not a pull request picks every package, so packages-publish.yml waits
# for the Windows jobs too, and a path-guard failure on Windows blocks a
# release.
#
# `windows-tier2` calls packages-windows-tier2.yml, which runs the libraries
# that start programs or resolve paths on Windows, when any of them is picked.
# Windows is tier 2 for them (S-0021): it reports, but never fails a pull
# request. packages-publish.yml sets `skip-windows-tier2`; on main, tier 2
# runs from its own push trigger.
#
# `old-git` runs typed-git and the packages that run real git (pr-update,
# trust-repo) on git 2.34, typed-git's supported floor, when any of them is
# picked. `verify` runs a current git, so without it the fallbacks for older
# git never run against a real one. A run that is not a pull request picks
# every package, so a failure here also blocks a release.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: packages

on:
  pull_request:
  workflow_call:
    inputs:
      skip-windows-tier2:
        description: Leave out the Windows tier-2 job; the caller runs it.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      filter: ${{ steps.pick.outputs.filter }}
      build: ${{ steps.pick.outputs.build }}
      dirs: ${{ steps.pick.outputs.dirs }}
    steps:
      # A pull request checks out its merge commit. Depth 2 brings in its
      # first parent, the base branch, which the script diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Node 24 runs the repo tooling in scripts/ directly: the shape checks
      # are TypeScript, which Node 24 runs by stripping the types.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Test the package pick
        run: node --test scripts/affected-packages.test.ts

      - name: Test the bounded runner
        run: node --test scripts/bounded-run.test.ts

      # The skillwright binary release tooling (skillwright-release.yml).
      - name: Test the skillwright release tooling
        run: node --test scripts/homebrew-formula.test.ts packages/rust/skillwright/release/dist.test.ts

      # package-shape-ts.ts reads semver ranges with the root's `semver`, so
      # install the root project only (not the packages).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter sdlc-packages

      - name: Typecheck the repo scripts
        run: pnpm run typecheck:scripts

      - name: Test the package shape rules
        run: node --test scripts/package-shape-ts.test.ts

      # docs/planning/standards/S-conformance-suites.md is the standard.
      - name: Test the conformance checks
        run: node --test scripts/conformance.test.ts

      - name: Check the conformance suites
        run: pnpm run check:conformance

      - name: Pick the packages to check
        id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/affected-packages.ts

  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    needs: changes
    # Runs even when `changes` failed, so the required check fails instead of
    # being skipped.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    env:
      FILTER: ${{ needs.changes.outputs.filter }}
      BUILD: ${{ needs.changes.outputs.build }}
      DIRS: ${{ needs.changes.outputs.dirs }}
      PICKED: ${{ needs.changes.outputs.packages != '[]' }}
    steps:
      - name: The package pick ran
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes job ended with: ${{ needs.changes.result }}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Not narrowed: a frozen install checks the lockfile for the whole
      # workspace.
      - name: Install
        run: pnpm install --frozen-lockfile

      # $FILTER and $BUILD are several flags, so they are left unquoted.
      # Build first: typecheck and test resolve the workspace packages through
      # their dist/.
      - name: Build
        if: env.PICKED == 'true'
        run: pnpm $BUILD --if-present run build

      # Every suite whose reference is TypeScript, picked or not: a generator
      # that writes different bytes means expected values went stale. The
      # generators run the packages' sources, so one leg is enough.
      - name: Regenerate the conformance suites
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: node scripts/conformance.ts --regenerate --reference ts

      - name: Typecheck
        if: env.PICKED == 'true'
        run: pnpm $FILTER --if-present run typecheck

      # A package opts into extra checks by defining a `check:extra` script
      # (for example a typecheck under an older TypeScript). The shared shape
      # pins `typecheck`, so package-specific checks go here instead.
      - name: Package-specific checks
        if: env.PICKED == 'true'
        run: pnpm $FILTER --if-present run check:extra

      - name: Test
        if: env.PICKED == 'true'
        run: pnpm $FILTER --no-bail --if-present run test

      - name: Smoke the built packages under Node
        if: env.PICKED == 'true'
        run: pnpm $FILTER --if-present run smoke

      - name: Lint
        if: env.PICKED == 'true'
        run: pnpm $FILTER --if-present run lint

      - name: Format check
        if: env.PICKED == 'true'
        run: pnpm $FILTER --if-present run format:check

      # Packs every package, so a picked one can install its siblings from
      # local tarballs, but checks only the picked ones. The checks are
      # TypeScript run by Node 24's type stripping, so only the Node 24 leg
      # runs them; they read the same packed files on every Node.
      - name: Pack, publint, attw
        if: env.PICKED == 'true' && matrix.node == '24'
        run: node scripts/check-packages.ts $DIRS

  # Not required by the ruleset. Lint, format and the tarball checks read text
  # and tarballs the same on every OS, so they run in `verify` only.
  windows:
    name: path-guard (windows-latest, node ${{ matrix.node }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/path-guard')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter './packages/ts/path-guard...'

      - name: Build
        run: pnpm --filter './packages/ts/path-guard...' --if-present run build

      - name: Typecheck
        run: pnpm --filter ./packages/ts/path-guard run typecheck

      - name: Test
        run: pnpm --filter ./packages/ts/path-guard run test

      - name: Smoke the built package under Node
        run: pnpm --filter ./packages/ts/path-guard run smoke

  # Not required by the ruleset. Ubuntu 22.04 ships git 2.34.1, but the
  # runner image installs a newer git from the git-core PPA, so the job
  # downgrades to the Ubuntu package and checks the version before testing.
  old-git:
    name: old git (ubuntu-22.04, git 2.34, node 24)
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/typed-git') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/pr-update') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/trust-repo')
    runs-on: ubuntu-22.04
    steps:
      - name: Install git 2.34
        run: |
          sudo apt-get update
          version=$(apt-cache madison git | awk '$3 ~ /^1:2\.34\./ { print $3; exit }')
          if [ -z "$version" ]; then
            echo "::error::no git 2.34 package in the Ubuntu 22.04 archive"
            exit 1
          fi
          sudo apt-get install -y --allow-downgrades "git=$version" "git-man=$version"
          git --version
          git --version | grep -q '^git version 2\.34\.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: >-
          pnpm install --frozen-lockfile
          --filter '@osdlc/typed-git...' --filter '@osdlc/pr-update...' --filter '@osdlc/trust-repo...'

      - name: Build
        run: >-
          pnpm --filter '@osdlc/typed-git...' --filter '@osdlc/pr-update...' --filter '@osdlc/trust-repo...'
          --if-present run build

      # No `...` here: install and build need the workspace dependencies, but
      # only these three packages run real git.
      - name: Test
        run: >-
          pnpm --filter @osdlc/typed-git --filter @osdlc/pr-update --filter @osdlc/trust-repo
          --no-bail run test

  windows-tier2:
    needs: changes
    if: >-
      !inputs.skip-windows-tier2 && (
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/command-seam') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/trust-repo') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/tiered-dirs') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/cli-tool') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/system-model') ||
      contains(fromJSON(needs.changes.outputs.packages), 'packages/ts/wayfinder'))
    uses: ./.github/workflows/packages-windows-tier2.yml
    with:
      packages: ${{ needs.changes.outputs.packages }}
