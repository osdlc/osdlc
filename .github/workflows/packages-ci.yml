# Checks the libraries under packages/ts/ on every pull request. On a push to
# main, packages-publish.yml calls this workflow and releases only if it
# passes.
#
# The `packages` job calls ts-packages-ci.yml, the shared CI that other
# repositories call as well; its header says what it checks. Its jobs report
# as `packages / changes` and `packages / verify (<os>, node <n>)`, and the
# "Protect main" ruleset requires the `verify` ones. A pull request checks
# only the packages it changed and the packages that depend on them, and the
# root package-checks.json adds this repository's shared files (this file
# among them), a change to which checks every package. A run that is not a
# pull request checks every package, including the call from
# packages-publish.yml. Here it also runs Node 26, builds the repo tooling
# (@osdlc/package-checks and @osdlc/conformance-suites are workspace packages), and
# checks the repo scripts.
#
# The jobs below read the pick, so they start once `packages` ends.
#
# `windows` runs path-guard on Windows, when path-guard is picked. A run that
# is not a pull request picks every package, so packages-publish.yml waits
# for the Windows jobs too, and a path-guard failure on Windows blocks a
# release.
#
# `windows-tier2` calls packages-windows-tier2.yml, which runs the libraries
# that start programs or resolve paths on Windows, when any of them is picked.
# Windows is tier 2 for them (S-0021): it reports, but never fails a pull
# request. packages-publish.yml sets `skip-windows-tier2`; on main, tier 2
# runs from its own push trigger.
#
# `old-git` runs typed-git and the packages that run real git (pr-update,
# trust-repo) on git 2.34, typed-git's supported floor, when any of them is
# picked. `verify` runs a current git, so without it the fallbacks for older
# git never run against a real one. A run that is not a pull request picks
# every package, so a failure here also blocks a release.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: packages

on:
  pull_request:
  workflow_call:
    inputs:
      skip-windows-tier2:
        description: Leave out the Windows tier-2 job; the caller runs it.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's older run,
# whose result no longer matters. Other events get a group of their own, so a
# push to main or a call from another workflow is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    uses: ./.github/workflows/ts-packages-ci.yml
    with:
      node: '["22", "24", "26"]'
      tooling-build: pnpm run build:tooling
      repo-checks: |
        node --test scripts/bounded-run.test.ts
        pnpm run typecheck:scripts

  # Not required by the ruleset. Lint, format and the tarball checks read text
  # and tarballs the same on every OS, so they run in `verify` only.
  windows:
    name: path-guard (windows-latest, node ${{ matrix.node }})
    needs: packages
    # Runs when the pick exists, even when a `verify` job failed.
    if: >-
      !cancelled() && contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/path-guard')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter './packages/ts/path-guard...'

      - name: Build
        run: pnpm --filter './packages/ts/path-guard...' --if-present run build

      - name: Typecheck
        run: pnpm --filter ./packages/ts/path-guard run typecheck

      - name: Test
        run: pnpm --filter ./packages/ts/path-guard run test

      - name: Smoke the built package under Node
        run: pnpm --filter ./packages/ts/path-guard run smoke

  # Not required by the ruleset. Ubuntu 22.04 ships git 2.34.1, but the
  # runner image installs a newer git from the git-core PPA, so the job
  # downgrades to the Ubuntu package and checks the version before testing.
  old-git:
    name: old git (ubuntu-22.04, git 2.34, node 24)
    needs: packages
    if: >-
      !cancelled() && (
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/typed-git') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/pr-update') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/trust-repo'))
    runs-on: ubuntu-22.04
    steps:
      - name: Install git 2.34
        run: |
          sudo apt-get update
          version=$(apt-cache madison git | awk '$3 ~ /^1:2\.34\./ { print $3; exit }')
          if [ -z "$version" ]; then
            echo "::error::no git 2.34 package in the Ubuntu 22.04 archive"
            exit 1
          fi
          sudo apt-get install -y --allow-downgrades "git=$version" "git-man=$version"
          git --version
          git --version | grep -q '^git version 2\.34\.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: >-
          pnpm install --frozen-lockfile
          --filter '@osdlc/typed-git...' --filter '@osdlc/pr-update...' --filter '@osdlc/trust-repo...'

      - name: Build
        run: >-
          pnpm --filter '@osdlc/typed-git...' --filter '@osdlc/pr-update...' --filter '@osdlc/trust-repo...'
          --if-present run build

      # No `...` here: install and build need the workspace dependencies, but
      # only these three packages run real git.
      - name: Test
        run: >-
          pnpm --filter @osdlc/typed-git --filter @osdlc/pr-update --filter @osdlc/trust-repo
          --no-bail run test

  # Not required by the ruleset, but packages-publish.yml calls this workflow
  # before every release, so a failure here blocks every library's release,
  # as old-git does. story-harness drives Chromium and Docker, which
  # `verify` does not install: its browser tests run here, then the
  # `story-shots` command end to end against a fixture build, in the pinned
  # Playwright image on the runner's Docker.
  story-harness:
    name: story-harness (browser and Docker, ubuntu-latest, node 24)
    needs: packages
    if: >-
      !cancelled() && contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/story-harness')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter '@osdlc/story-harness...'

      - name: Build
        run: pnpm --filter '@osdlc/story-harness...' --if-present run build

      - name: Install Chromium
        run: pnpm --filter @osdlc/story-harness exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @osdlc/story-harness run test:browser

      - name: story-shots end to end
        run: pnpm --filter @osdlc/story-harness run test:shots

  windows-tier2:
    needs: packages
    if: >-
      !cancelled() && !inputs.skip-windows-tier2 && (
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/command-seam') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/trust-repo') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/tiered-dirs') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/cli-tool') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/system-model') ||
      contains(fromJSON(needs.packages.outputs.packages || '[]'), 'packages/ts/wayfinder'))
    uses: ./.github/workflows/packages-windows-tier2.yml
    with:
      packages: ${{ needs.packages.outputs.packages }}
