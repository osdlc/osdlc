# Builds the Astro site in site/, with the libraries' API reference, and
# publishes it to GitHub Pages. Pull requests build it to catch errors; only
# main deploys.
name: site

on:
  pull_request:
    paths: ['site/**', 'standards/**', 'packages/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'standards/**', 'packages/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      # site/ is not part of the packages workspace; install it on its own.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      # rustdoc and TypeDoc into public/api. cargo is on the runner; rustup
      # installs the toolchain packages/rust/rust-toolchain.toml pins.
      - run: pnpm run api
      - run: pnpm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
