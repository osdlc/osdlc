# Installs the tools the wasm build.sh scripts need besides the Rust
# toolchain: the wasm-bindgen CLI, and binaryen's wasm-opt (its path in
# WASM_OPT in GITHUB_ENV). The `wasm` job in rust-ci.yml and the
# `release-pr` job in release-plz.yml both build the wasm with it, so both
# get the same bytes.
#
# Keep the wasm-bindgen version in step with REQUIRED_WASM_BINDGEN in each
# build.sh and the wasm-bindgen pin in packages/rust/Cargo.toml, and the
# binaryen version with REQUIRED_WASM_OPT.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: rust-wasm-tools
description: Install wasm-bindgen and wasm-opt at the versions build.sh requires.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: wasm-bindgen@0.2.126

    - name: Install binaryen
      shell: bash
      env:
        BINARYEN_VERSION: version_131
        BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
      run: |
        set -euo pipefail
        tarball="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$tarball" \
          "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${tarball}"
        echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
        echo "WASM_OPT=$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" >> "$GITHUB_ENV"
