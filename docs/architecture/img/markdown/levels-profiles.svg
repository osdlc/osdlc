}</style><rect class="bg" width="440" height="318"/><text class="rl" x="16" y="26">Levels, parents and references</text><text class="rs" x="16" y="44">Levels: how much a corpus declares.</text><text class="rs" x="16" y="60">Parents give types. Referenced corpora give records.</text><g class="lvl"><rect x="16" y="76" width="200" height="50" rx="8"/></g><text class="cn" x="28" y="97">2 · Typed</text><text class="cs" x="28" y="114">every type has a JSON Schema</text><g class="lvl"><rect x="16" y="136" width="200" height="50" rx="8"/></g><text class="cn" x="28" y="157">1 · Records</text><text class="cs" x="28" y="174">a root file, type folders, ids</text><g class="lvl"><rect x="16" y="196" width="200" height="50" rx="8"/></g><text class="cn" x="28" y="217">0 · Linked notes</text><text class="cs" x="28" y="234">declares nothing; any vault</text><g class="prof"><rect x="246" y="76" width="180" height="50" rx="8"/></g><text class="cn" x="258" y="97">claims profile</text><text class="cs" x="258" y="114">types, by extends or uses</text><path class="tie" d="M246,101 C232,101 232,101 217,101"/><g class="prof"><rect x="246" y="136" width="180" height="50" rx="8"/></g><text class="cn" x="258" y="157">sdlc profile</text><text class="cs" x="258" y="174">types, by extends or uses</text><path class="tie" d="M246,161 C232,161 232,101 217,101"/><g class="refc"><rect x="246" y="196" width="180" height="50" rx="8"/></g><text class="cn" x="258" y="217">sdlc starter</text><text class="cs" x="258" y="234">records, by references</text><path class="tie ref" d="M246,221 C232,221 232,221 217,221"/><text class="cs" x="16" y="266">extends and uses need level 2. references works at any level:</text><text class="cs" x="16" y="282">sync copies the records into _references/&lt;prefix&gt;/.</text><text class="cs" x="16" y="298">A corpus can name several of each, next to its own types.</text></svg>
