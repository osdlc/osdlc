# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# Gradle's caches and wrapper distributions, under GRADLE_USER_HOME, or
# ~/.gradle when it is unset. No Gradle command clears them on demand, so each
# is removed as a folder: the caches once nothing in them changed for a week,
# and each wrapper distribution once unused for 30 days. While a process with
# the word gradle in its command line runs, every candidate is refused in-use,
# at the survey and again before each delete. The word matches the daemon
# (org.gradle...GradleDaemon), a `--no-daemon` build
# (org.gradle.wrapper.GradleWrapperMain or org.gradle.launcher.GradleMain) and
# the `gradle` program. A wrapper distribution's idle time is when it was
# unpacked: `./gradlew` writes nothing in it.
descriptor: 1
store: gradle
detect:
  any: [{ onPath: gradle }, { exists: caches }, { exists: wrapper }]
vars:
  GRADLE_USER_HOME:
    - env: GRADLE_USER_HOME
    - value: ~/.gradle
paths:
  caches: { macos: '${GRADLE_USER_HOME}/caches', linux: '${GRADLE_USER_HOME}/caches' }
  wrapper:
    macos: '${GRADLE_USER_HOME}/wrapper/dists'
    linux: '${GRADLE_USER_HOME}/wrapper/dists'
candidates:
  - path: caches
    costDescription: re-download
    idleHours: 168
  - path: wrapper
    glob: '*/'
    costDescription: re-download
    idleHours: 720
inUse:
  processes: [gradle]
