# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# The Hugging Face hub cache, on the default folder. Each model, dataset and
# space is its own candidate, removed as a folder once nothing in it changed
# for 30 days: a model is large to download again.
# Loading a cached model changes nothing in it, so its idle time is counted
# from its last download, not its last use.
# `hf cache prune` can't be pointed at one entry, so it isn't used. No process
# name identifies a reader (any Python program can be one), and the lock files
# under .locks stay after a download, so neither is an in-use check.
descriptor: 1
store: huggingface-hub
detect:
  any: [{ onPath: hf }, { exists: hub }]
paths:
  hub: { macos: ~/.cache/huggingface/hub, linux: ~/.cache/huggingface/hub }
candidates:
  - path: hub
    glob: 'models--*/'
    costDescription: re-download
    idleHours: 720
  - path: hub
    glob: 'datasets--*/'
    costDescription: re-download
    idleHours: 720
  - path: hub
    glob: 'spaces--*/'
    costDescription: re-download
    idleHours: 720
