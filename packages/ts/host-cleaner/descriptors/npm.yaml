# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# npm's package cache, on the default folder. It is removed as a folder once
# idle, which is what `npm cache clean --force` does; npm can't be pointed at
# this folder, since its `cache` setting names the folder above it. The npx
# cache and the logs are left out.
descriptor: 1
store: npm
detect:
  any: [{ onPath: npm }, { exists: cache }]
paths:
  cache: { macos: ~/.npm/_cacache, linux: ~/.npm/_cacache }
candidates:
  - path: cache
    costDescription: re-download
inUse:
  processes: [npm]
