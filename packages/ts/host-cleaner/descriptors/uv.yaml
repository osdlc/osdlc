# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# uv's cache: UV_CACHE_DIR, else cache-dir in uv's user uv.toml, else uv under
# XDG_CACHE_HOME, which uv uses on macOS too. It is pruned: `uv cache prune`
# removes only unused entries, so it runs with no idle check. Without uv on
# PATH it is listed with a no-prune-tool protest and left alone (D12). Managed
# Pythons and installed tools are left out: deleting them breaks environments
# and commands.
descriptor: 1
store: uv
detect:
  any: [{ onPath: uv }, { exists: cache }]
vars:
  UV_CACHE_DIR:
    - env: UV_CACHE_DIR
    - file: '${XDG_CONFIG_HOME}/uv/uv.toml'
      key: cache-dir
    - value: '${XDG_CACHE_HOME}/uv'
paths:
  cache: { macos: '${UV_CACHE_DIR}', linux: '${UV_CACHE_DIR}' }
candidates:
  - path: cache
    costDescription: re-download
    command: [uv, cache, prune, --cache-dir, '{path}']
    removes: unused
inUse:
  processes: [uv]
