# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# pip's wheel and HTTP cache, on the default folder for each OS. It is removed
# as a folder once idle. `pip cache purge` would empty the same folder, but the
# `pip` on PATH may belong to any Python, or be too old to have `cache`. While
# `pip`, `pip3` or `python -m pip` runs, it is refused in-use.
descriptor: 1
store: pip
detect:
  any: [{ onPath: pip }, { onPath: pip3 }, { exists: cache }]
paths:
  cache: { macos: ~/Library/Caches/pip, linux: ~/.cache/pip }
candidates:
  - path: cache
    costDescription: re-download
inUse:
  processes: [pip, pip3]
