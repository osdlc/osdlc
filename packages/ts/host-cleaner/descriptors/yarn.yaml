# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# Yarn Classic's (Yarn 1) global cache, which YARN_CACHE_FOLDER moves, else
# under XDG_CACHE_HOME when that is set or on Linux, removed as a folder once
# idle. `yarn cache clean` acts on whichever Yarn the folder it runs in
# selects, and can't be pointed at this folder, so it isn't used. Berry's
# global cache (~/.yarn/berry/cache) is left out: a Plug'n'Play project loads
# its packages from the zips there at run time, and reading them changes no
# modification time, so a cache in daily use would look idle. Projects' own
# .yarn folders are left out too.
descriptor: 1
store: yarn
detect:
  any: [{ onPath: yarn }, { exists: classic }]
vars:
  YARN_CACHE_FOLDER:
    - env: YARN_CACHE_FOLDER
    - value: '${XDG_CACHE_HOME_SET}/yarn'
    - value: { macos: ~/Library/Caches/Yarn, linux: '${XDG_CACHE_HOME}/yarn' }
  # XDG_CACHE_HOME only when the environment sets it: Classic uses ~/Library
  # on macOS otherwise.
  XDG_CACHE_HOME_SET:
    - env: XDG_CACHE_HOME
paths:
  classic: { macos: '${YARN_CACHE_FOLDER}', linux: '${YARN_CACHE_FOLDER}' }
candidates:
  - path: classic
    costDescription: re-download
inUse:
  processes: [yarn]
