# yaml-language-server: $schema=https://unpkg.com/@osdlc/host-cleaner@1/schemas/descriptor-1.json
# Yarn's global caches: Berry's (Yarn 2 and later), the cache folder under its
# global folder, which YARN_GLOBAL_FOLDER or globalFolder in ~/.yarnrc.yml
# moves, else yarn/berry under XDG_DATA_HOME when that is set, else
# ~/.yarn/berry; and Classic's (Yarn 1), which YARN_CACHE_FOLDER moves, else
# under XDG_CACHE_HOME when that is set or on Linux. Each is removed as a
# folder once idle. `yarn cache clean` acts on whichever Yarn the folder it
# runs in selects, and can't be pointed at one of these folders, so it isn't
# used. Projects' own .yarn folders are left out.
descriptor: 1
store: yarn
detect:
  any: [{ onPath: yarn }, { exists: berry }, { exists: classic }]
vars:
  YARN_GLOBAL_FOLDER:
    - env: YARN_GLOBAL_FOLDER
    - file: ~/.yarnrc.yml
      key: globalFolder
    - value: '${XDG_DATA_HOME_SET}/yarn/berry'
    - value: ~/.yarn/berry
  YARN_CACHE_FOLDER:
    - env: YARN_CACHE_FOLDER
    - value: '${XDG_CACHE_HOME_SET}/yarn'
    - value: { macos: ~/Library/Caches/Yarn, linux: '${XDG_CACHE_HOME}/yarn' }
  # The XDG folders only when the environment sets them: Berry ignores
  # XDG_DATA_HOME's default, and Classic uses ~/Library on macOS otherwise.
  XDG_DATA_HOME_SET:
    - env: XDG_DATA_HOME
  XDG_CACHE_HOME_SET:
    - env: XDG_CACHE_HOME
paths:
  berry: { macos: '${YARN_GLOBAL_FOLDER}/cache', linux: '${YARN_GLOBAL_FOLDER}/cache' }
  classic: { macos: '${YARN_CACHE_FOLDER}', linux: '${YARN_CACHE_FOLDER}' }
candidates:
  - path: berry
    costDescription: re-download
  - path: classic
    costDescription: re-download
inUse:
  processes: [yarn]
