<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="t d"><title id="t">Inside a lease</title><desc id="d">The ref refs/locks/deploy points at the newest commit, C3. Each commit holds a lease.json and points to the commit before it: C3 renewed until 12:30, C2 renewed until 12:20, C1 claimed until 12:10.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="379" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="700" text-anchor="start">Inside a lease: a ref, a chain of commits, a JSON file in each</text><rect x="28" y="78" width="161" height="28" rx="14.0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="108.5" y="96.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">refs/locks/deploy</text><line x1="189" y1="92" x2="210" y2="120" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-a)"/><rect x="92" y="122" width="180" height="128" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="108" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">commit C3</text><text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="end" font-style="italic">newest</text><line x1="104" y1="160" x2="260" y2="160" stroke="#d1d9e0"/><text x="108" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">lease.json</text><text x="108" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">holder: "runner-1"</text><text x="108" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">until: 12:30</text><line x1="274" y1="186" x2="320" y2="186" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)"/><text x="297" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" font-weight="normal" text-anchor="middle">parent</text><text x="182" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="middle">renewed</text><rect x="322" y="122" width="180" height="128" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="338" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">commit C2</text><line x1="334" y1="160" x2="490" y2="160" stroke="#d1d9e0"/><text x="338" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">lease.json</text><text x="338" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">holder: "runner-1"</text><text x="338" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">until: 12:20</text><line x1="504" y1="186" x2="550" y2="186" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)"/><text x="527" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" font-weight="normal" text-anchor="middle">parent</text><text x="412" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="600" text-anchor="middle">renewed</text><rect x="552" y="122" width="180" height="128" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="568" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">commit C1</text><text x="716" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="end" font-style="italic">oldest</text><line x1="564" y1="160" x2="720" y2="160" stroke="#d1d9e0"/><text x="568" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">lease.json</text><text x="568" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">holder: "runner-1"</text><text x="568" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">until: 12:10</text><text x="642" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="600" text-anchor="middle">claimed</text><rect x="92" y="296" width="180" height="62" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="106" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">tree of C3:</text><text x="106" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">lease.json, notes.md</text><text x="300" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" text-anchor="start">Each write is a new commit whose parent is the last one,</text><text x="300" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="normal" text-anchor="start">so `git log refs/locks/deploy` is the lease's history.</text></svg>
