<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d"><title id="t">What to do when a call fails</title><desc id="d">Every error is a RefLeaseError with a kind. cas-failed: someone wrote first; read again and decide, retrying is fine. git-failed: git itself failed; show the stderr and stop. ref-not-found: there is no lease; create one if you meant to. payload-unreadable or namespace-conflict: something outside the library wrote that ref; fix it by hand.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="399" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="700" text-anchor="start">A call threw: look at e.kind</text><rect x="300" y="60" width="180" height="46" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="390" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle">RefLeaseError</text><path d="M 390 108 C 390 140, 108 130, 108 158" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-ok)"/><rect x="22" y="160" width="172" height="196" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="108" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a7f37" font-weight="700" text-anchor="middle">cas-failed</text><line x1="34" y1="198" x2="182" y2="198" stroke="#1a7f37" stroke-opacity="0.35"/><text x="36" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Someone wrote first.</text><text x="36" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Read the lease again,</text><text x="36" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">then decide.</text><rect x="36" y="318" width="69" height="26" rx="13.0" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text x="70.5" y="335.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a7f37" font-weight="600" text-anchor="middle">retry ✔</text><path d="M 390 108 C 390 140, 296 130, 296 158" fill="none" stroke="#cf222e" stroke-width="1.8" marker-end="url(#arrow-no)"/><rect x="210" y="160" width="172" height="196" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="296" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#cf222e" font-weight="700" text-anchor="middle">git-failed</text><line x1="222" y1="198" x2="370" y2="198" stroke="#cf222e" stroke-opacity="0.35"/><text x="224" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">git itself failed:</text><text x="224" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">no network, a hook</text><text x="224" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">said no, bad URL.</text><text x="224" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Show e.stderr.</text><rect x="224" y="318" width="62" height="26" rx="13.0" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/><text x="255.0" y="335.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#cf222e" font-weight="600" text-anchor="middle">stop ✘</text><path d="M 390 108 C 390 140, 484 130, 484 158" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)"/><rect x="398" y="160" width="172" height="196" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="484" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#57606a" font-weight="700" text-anchor="middle">ref-not-found</text><line x1="410" y1="198" x2="558" y2="198" stroke="#57606a" stroke-opacity="0.35"/><text x="412" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">There is no lease</text><text x="412" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">at that ref.</text><text x="412" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Create one if</text><text x="412" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">you meant to.</text><rect x="412" y="318" width="83" height="26" rx="13.0" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="453.5" y="335.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a" font-weight="600" text-anchor="middle">your call</text><path d="M 390 108 C 390 140, 672 130, 672 158" fill="none" stroke="#9a6700" stroke-width="1.8" marker-end="url(#arrow-g)"/><rect x="586" y="160" width="172" height="196" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="672" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#9a6700" font-weight="700" text-anchor="middle">payload-unreadable</text><line x1="598" y1="198" x2="746" y2="198" stroke="#9a6700" stroke-opacity="0.35"/><text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">or namespace-conflict:</text><text x="600" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">something else wrote</text><text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">that ref. Fix it</text><text x="600" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">by hand.</text><rect x="600" y="318" width="62" height="26" rx="13.0" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/><text x="631.0" y="335.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a6700" font-weight="600" text-anchor="middle">stop ✘</text><text x="28" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start">A decode function's own error is not wrapped: it reaches you as thrown.</text></svg>
