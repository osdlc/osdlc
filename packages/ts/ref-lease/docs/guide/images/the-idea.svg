<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-labelledby="t d"><title id="t">One lock, kept in a git remote</title><desc id="d">Three workers push to and fetch from one git remote, the authority. On it, the ref refs/locks/deploy points at a commit whose lease.json says runner 1 holds the lease until 12:10.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="359" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="700" text-anchor="start">One lock, kept in a git remote everyone can push to</text><rect x="28" y="80" width="190" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="46" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0969da" font-weight="700" text-anchor="start">CI runner 1</text><text x="46" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">holds the lease</text><line x1="222" y1="111" x2="296" y2="120" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)" marker-start="url(#arrow-g)"/><rect x="28" y="166" width="190" height="62" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="46" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#bc4c00" font-weight="700" text-anchor="start">CI runner 2</text><text x="46" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">waiting</text><line x1="222" y1="197" x2="296" y2="170" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)" marker-start="url(#arrow-g)"/><rect x="28" y="252" width="190" height="62" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="46" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#bc4c00" font-weight="700" text-anchor="start">Agent on a laptop</text><text x="46" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">waiting</text><line x1="222" y1="283" x2="296" y2="220" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)" marker-start="url(#arrow-g)"/><rect x="300" y="70" width="230" height="250" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="415" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="700" text-anchor="middle">Authority</text><text x="415" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">origin, a URL, or a bare repo</text><rect x="330" y="140" width="161" height="28" rx="14.0" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="410.5" y="158.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">refs/locks/deploy</text><line x1="415" y1="170" x2="415" y2="200" stroke="#1f2328" stroke-width="1.8" marker-end="url(#arrow-ink)"/><rect x="350" y="202" width="130" height="44" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="415" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">commit C2</text><line x1="415" y1="248" x2="415" y2="272" stroke="#1f2328" stroke-width="1.8" marker-end="url(#arrow-ink)"/><text x="415" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">lease.json</text><line x1="482" y1="286" x2="560" y2="200" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-g)"/><rect x="562" y="120" width="190" height="130" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="578" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#0969da" font-weight="700" text-anchor="start">lease.json</text><text x="578" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">{</text><text x="578" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">  "holder": "runner-1",</text><text x="578" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">  "until": "12:10"</text><text x="578" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">}</text><text x="562" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">Your JSON. The library</text><text x="562" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">stores it, never reads it.</text><text x="28" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e" font-weight="normal" text-anchor="start">Whoever moves the ref first holds the lease, and everyone can fetch it to see who that is.</text></svg>
