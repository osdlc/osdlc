<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-labelledby="t d"><title id="t">Two workers race for one lease</title><desc id="d">Worker A and worker B both read the ref at commit C1. A pushes C2 only if the ref is still C1: accepted, the ref moves to C2. B pushes C3 only if the ref is still C1: refused, because it is now C2. B gets CasFailed, reads again and sees that A holds the lease.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="469" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="700" text-anchor="start">Two workers, one lease: exactly one push wins</text><rect x="60" y="62" width="160" height="40" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="140" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0969da" font-weight="700" text-anchor="middle">Worker A</text><line x1="140" y1="102" x2="140" y2="440" stroke="#d1d9e0" stroke-width="2"/><rect x="310" y="62" width="160" height="40" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="390" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#57606a" font-weight="700" text-anchor="middle">Authority</text><line x1="390" y1="102" x2="390" y2="440" stroke="#d1d9e0" stroke-width="2"/><rect x="560" y="62" width="160" height="40" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="640" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#bc4c00" font-weight="700" text-anchor="middle">Worker B</text><line x1="640" y1="102" x2="640" y2="440" stroke="#d1d9e0" stroke-width="2"/><rect x="328" y="112" width="88" height="28" rx="14.0" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="372.0" y="130.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">ref → C1</text><line x1="140" y1="160" x2="386" y2="160" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-a)"/><text x="152" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="normal" text-anchor="start">1  read the lease</text><line x1="390" y1="182" x2="144" y2="182" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-g)"/><text x="152" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start">it is at C1</text><line x1="640" y1="160" x2="394" y2="160" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#arrow-b)"/><text x="628" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#bc4c00" font-weight="normal" text-anchor="end">1  read the lease</text><line x1="390" y1="182" x2="636" y2="182" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-g)"/><text x="628" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="end">it is at C1</text><line x1="140" y1="248" x2="386" y2="248" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-a)"/><text x="152" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="600" text-anchor="start">2  push C2, only if still C1</text><rect x="328" y="262" width="88" height="28" rx="14.0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="372.0" y="280.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1a7f37" font-weight="600" text-anchor="middle">ref → C2</text><line x1="390" y1="306" x2="144" y2="306" stroke="#1a7f37" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-ok)"/><text x="152" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="700" text-anchor="start">✔ accepted</text><line x1="640" y1="350" x2="394" y2="350" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#arrow-b)"/><text x="628" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#bc4c00" font-weight="600" text-anchor="end">3  push C3, only if still C1</text><line x1="390" y1="376" x2="636" y2="376" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-no)"/><text x="628" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#cf222e" font-weight="700" text-anchor="end">✘ refused: it is C2 now</text><rect x="28" y="410" width="230" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="143" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0969da" font-weight="700" text-anchor="middle">A holds the lease</text><rect x="500" y="410" width="252" height="46" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="626" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="normal" text-anchor="middle">B gets CasFailed, reads again,</text><text x="626" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="normal" text-anchor="middle">and sees that A holds it</text></svg>
