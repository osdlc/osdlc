<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d"><title id="t">The life of a lease</title><desc id="d">A lease starts free. casCreate claims it and it is held. casReplace renews it. If nobody renews it, it expires, and another worker can take it over with casReplace. casDelete releases it, and it is free again.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="399" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="700" text-anchor="start">The life of a lease, and the call that moves it</text><rect x="40" y="170" width="150" height="70" rx="35" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="115" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" font-weight="700" text-anchor="middle">Free</text><text x="115" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="middle">no ref yet</text><rect x="320" y="170" width="160" height="70" rx="35" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="400" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0969da" font-weight="700" text-anchor="middle">Held</text><text x="400" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0969da" font-weight="normal" text-anchor="middle">by one worker</text><rect x="600" y="170" width="150" height="70" rx="35" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="675" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9a6700" font-weight="700" text-anchor="middle">Expired</text><text x="675" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a6700" font-weight="normal" text-anchor="middle">nobody renewed</text><line x1="192" y1="192" x2="318" y2="192" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-a)"/><text x="255" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="700" text-anchor="middle">claim</text><text x="255" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e" font-weight="normal" text-anchor="middle">casCreate</text><path d="M 370 168 C 360 100, 440 100, 430 166" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-a)"/><text x="400" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0969da" font-weight="700" text-anchor="middle">renew · casReplace</text><line x1="482" y1="205" x2="598" y2="205" stroke="#9a6700" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-g)"/><text x="540" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a6700" font-weight="600" text-anchor="middle">time passes</text><path d="M 660 242 C 640 320, 470 320, 440 244" fill="none" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#arrow-b)"/><text x="552" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#bc4c00" font-weight="700" text-anchor="middle">another worker takes over · casReplace</text><path d="M 350 242 C 320 320, 160 320, 130 244" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow-g)"/><text x="240" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle">release · casDelete</text><text x="28" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start">Every arrow is one compare-and-swap, so two workers can never both make the same move.</text><text x="28" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e" font-weight="normal" text-anchor="start">Expiry is a rule in your payload: the library keeps no clock.</text></svg>
