<!doctype html>
<meta charset="utf-8" />
<title>@APP@</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- @STYLE@ -->

<div id="chrome">
  <!-- Above the status strip, and empty until there is something to say. A
     withheld runner needs the user to act, so it does not belong in a row
     of counts and keyboard hints. -->
  <div class="trustbar" id="trustbar" hidden></div>
  <div class="status" id="status"></div>
  <!-- One stable live region, so a screen reader hears when loading starts and ends. -->
  <div class="sr-only" id="announce" aria-live="polite"></div>
  <header>
    <div class="searchrow">
      <div class="searchbox">
        <input
          id="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          autofocus
          placeholder="Search tasks - terms are ANDed, a leading quote forces an exact term"
        />
        <div
          class="seg inline"
          id="mode"
          title="How terms match. Fuzzy allows gaps; Exact requires the literal substring. A leading quote forces one term exact either way."
        >
          <button data-mode="fuzzy" aria-pressed="true">Fuzzy</button>
          <button data-mode="exact" aria-pressed="false">Exact</button>
        </div>
      </div>
      <!-- At phone width the filters fold behind this one button. -->
      <button
        class="toolbtn"
        id="filtersbtn"
        aria-expanded="false"
        aria-controls="filters"
        title="Scope, Services, Declared and Runners"
      >
        Filters
      </button>
      <div class="cluster filters" id="filters" role="group" aria-labelledby="scope-label">
        <span class="cluster-label" id="scope-label">Scope</span>
        <div
          class="seg"
          id="depth"
          title="How far into the repository to look, by where a task is declared. Root is the repo's own justfile, package.json and moon project; the rest belong to its packages."
        >
          <button data-depth="0">Root</button>
          <button data-depth="2">+2</button>
          <button data-depth="3">+3</button>
          <button data-depth="99" aria-pressed="true">All</button>
        </div>
        <button
          class="toolbtn"
          id="services"
          aria-pressed="false"
          title="Only services - tasks that run until you stop them: dev servers, watchers, previews"
        >
          Services
        </button>
        <button
          class="toolbtn"
          id="declared"
          aria-pressed="false"
          title="Only tasks a config file declares, dropping ones inferred from convention (cargo test, ruff check)"
        >
          Declared
        </button>
        <div id="pickerhost"></div>
      </div>
      <div class="cluster" role="group" aria-labelledby="view-label">
        <span class="cluster-label" id="view-label">View</span>
        <button class="toolbtn" id="expand" title="Expand or collapse every group">Collapse</button>
        <button class="toolbtn" id="refresh" title="Re-probe every runner now">Refresh</button>
      </div>
      <div class="cluster tools">
        <button
          class="toolbtn iconbtn"
          id="theme"
          data-theme-choice="system"
          title="Colour scheme: System (follows your OS). Click for Light."
          aria-label="Colour scheme: System. Click for Light."
        >
          ◐
        </button>
        <button
          class="helpbtn"
          id="settingsbtn"
          title="This project's @APP@ configuration"
          aria-label="Settings"
        >
          ⚙
        </button>
        <button class="helpbtn" id="helpbtn" title="What all of this means" aria-label="Help">
          ?
        </button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div class="colheads" id="colheads"></div>
</div>
<main id="out"></main>

<dialog id="help" aria-labelledby="help-title">
  <div class="help-body" id="help-body" tabindex="-1"></div>
  <form method="dialog"><button class="toolbtn">Close</button></form>
</dialog>

<dialog id="settings" aria-label="Settings">
  <div class="settings-body" id="settings-body" tabindex="-1"></div>
  <form method="dialog"><button class="toolbtn">Close</button></form>
</dialog>

<!-- @SCRIPT@ -->
