[package]
name = "frontmatter-lossless"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Pure, byte-exact Markdown frontmatter framing: split a note into verbatim YAML and body with source byte offsets, and recompose it losslessly. BOM, CRLF, and fence bytes are preserved; a malformed or unterminated block degrades to body-only. No dependencies beyond std."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["markdown", "frontmatter", "yaml", "parser", "static-site"]
categories = ["parser-implementations", "text-processing"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[lib]
name = "frontmatter_lossless"

# The conformance suite's generator: `cargo run -p frontmatter-lossless
# --example conformance-write` rewrites the expected values in
# packages/conformance/frontmatter-lossless/suite.json. It lives under tests/,
# beside the runner it shares code with, so it is not published.
[[example]]
name = "conformance-write"
path = "tests/conformance/write.rs"

# tests/conformance.rs and the generator only: they read and write the
# family's suite, packages/conformance/frontmatter-lossless/suite.json, which
# the TypeScript package (packages/ts/frontmatter-lossless) also runs.
# `preserve_order` keeps the suite's keys in the order they are written. The
# crate parses no JSON at runtime.
[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
