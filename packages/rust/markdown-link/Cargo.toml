[package]
name = "markdown-link"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
description = "Parse and resolve Markdown and wiki-style links in notes: every `[[link]]`, `![[embed]]`, and relative Markdown link in a note body or its frontmatter, with code spans excluded, plus a LinkIndex that resolves a target against a set of file paths."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/osdlc/osdlc/tree/main/packages/rust/markdown-link"
readme = "README.md"
keywords = ["markdown", "wikilink", "links", "parser", "resolver"]
categories = ["parser-implementations", "text-processing"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  # `README.md` above matches at any depth, so the fixture vault is left out.
  "!tests/fixtures/**",
]

[package.metadata.docs.rs]
# Build the docs for the default target only; the crate has no platform code.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
yaml-splice = { workspace = true }
slug-collate = { workspace = true }

[dev-dependencies]
# Frontmatter framing for the differential test.
frontmatter-lossless = { workspace = true }
# tests/conformance.rs and the generator only: they read and write the family's
# suite, packages/conformance/markdown-link/suite.json, which the TypeScript
# package (packages/ts/markdown-link) also runs. `preserve_order` keeps the
# suite's keys in the order they are written. The crate parses no JSON at
# runtime.
serde_json = { workspace = true, features = ["preserve_order"] }
# The benchmark in benches/body_links.rs; CI's perf gate runs it.
criterion = { workspace = true }

# The conformance suite's generator: `cargo run -p markdown-link --example
# conformance-write` rewrites the expected values in
# packages/conformance/markdown-link/suite.json. It lives under tests/, beside
# the runner it shares code with, so it is not published.
[[example]]
name = "conformance-write"
path = "tests/conformance/write.rs"

[[bench]]
name = "body_links"
harness = false

[lints]
workspace = true
