[package]
name = "osdlc-file-lock"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Cross-process exclusive file locks that interoperate with the npm package @osdlc/file-lock: a JSON lock hard-linked into place, race-safe takeover of a stale lock through a hash-named marker, and token-fenced release."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lock", "lockfile", "mutex", "cross-process", "stale-lock"]
categories = ["filesystem", "concurrency"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[lib]
name = "osdlc_file_lock"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
