[package]
name = "tiered-dirs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Per-OS directories for a vendor's programs, by tier (vendor, suite, standalone tool) and home (durable, config, cache, logs, runtime), with override variables and tests kept off the real home."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["directories", "xdg", "app-dirs", "config", "cache"]
categories = ["filesystem", "config"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
dirs = "6"
thiserror = { workspace = true }

# tests/parity.rs only: it reads tests/fixtures/parity.json, the fixture the
# TypeScript twin carries a copy of. This crate parses nothing at runtime.
[dev-dependencies]
# 1.0.220 is the first serde that pins its own serde_derive. With an older
# serde, the lowest versions resolve a newer serde_derive that does not build.
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
