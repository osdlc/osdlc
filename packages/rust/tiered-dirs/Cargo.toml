[package]
name = "tiered-dirs"
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
description = "Per-OS directories for a vendor's programs, by tier (vendor, suite, standalone tool) and home (durable, config, cache, state, logs, runtime), with native or XDG paths, override variables and tests kept off the real home."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["directories", "xdg", "app-dirs", "config", "cache"]
categories = ["filesystem", "config"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
# 7 changed only `preference_dir` on Windows, which this crate does not call.
dirs = ">=6, <8"
thiserror = { workspace = true }

# tests/parity.rs only: it reads tests/fixtures/parity.json, the fixture the
# TypeScript twin reads too. This crate parses nothing at runtime.
[dev-dependencies]
# 1.0.220 is the first serde that pins its own serde_derive. With an older
# serde, the lowest versions resolve a newer serde_derive that does not build.
serde = { version = "1.0.220", features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
