[package]
name = "glob-intersect"
version = "0.3.0"
# Held back from crates.io for now: a first release needs CARGO_REGISTRY_TOKEN,
# so it cannot share a release-plz run with the realigned crates that publish
# through trusted publishing (packages/README.md, crates.io rules 4 and 7).
# Remove this line, and its entry in release-plz.toml, in a pull request of its own.
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Path-pattern overlap engine: do two globs share a common matching path? A pure core (segment automaton and synchronized product) that returns a witness path for every overlap, plus an optional filesystem layer. The Rust twin of @osdlc/intersect."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["glob", "pattern", "intersection", "overlap", "path"]
categories = ["filesystem", "algorithms"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[lib]
name = "glob_intersect"

[features]
# `fs` mirrors the TypeScript package's `@osdlc/intersect/fs` entry point: the
# only layer that reads disk and the only one carrying a dependency. Default-on
# so `cargo test -p glob-intersect` covers it; `default-features = false` buys
# the pure core with `thiserror` alone.
default = ["fs"]
fs = ["dep:walkdir"]

[dependencies]
thiserror = { workspace = true }
walkdir = { workspace = true, optional = true }

# tests/conformance.rs only: it reads the @osdlc/intersect corpus in place
# (packages/ts/intersect/fixtures/) and materializes each fs case's `tree` in a
# temp dir, the way the TypeScript `tests/fs.test.ts` harness does.
[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
