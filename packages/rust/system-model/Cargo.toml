[package]
name = "system-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A repository's system model: walk a directory tree for package manifests (package.json, Cargo.toml) and build a typed dependency graph of the packages, apps and crates it finds, plus the containment tree their layout implies. The Rust twin of @osdlc/system-model."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["monorepo", "dependency-graph", "manifest", "cargo", "npm"]
categories = ["development-tools", "filesystem"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
