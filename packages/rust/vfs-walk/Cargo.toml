[package]
name = "vfs-walk"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "A sorted, depth-first walk of a folder tree through a vfs-seam Vfs, with prune and skip lists, a caller's entry filter, a symlink policy, an error policy and modification times. No Markdown or vault rules."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/osdlc/osdlc/tree/main/packages/rust/vfs-walk"
readme = "README.md"
keywords = ["walk", "vfs", "filesystem", "wasm", "directory"]
categories = ["filesystem", "wasm"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

# No features: the crate reads only through a Vfs, so it builds for
# wasm32-unknown-unknown as it is. vfs-seam's `native` feature (NativeVfs) is
# the caller's to turn on.
[dependencies]
thiserror = { workspace = true }
vfs-seam = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
vfs-seam = { workspace = true, features = ["native"] }

[lints]
workspace = true
