[package]
name = "typed-git"
version = "0.4.0"
# Held back from crates.io: first-release step 1 of 3. A first release needs
# CARGO_REGISTRY_TOKEN, a new version of a published crate needs trusted
# publishing, and one release-plz run uses one credential. Remove this line
# and the entry in packages/rust/release-plz.toml in a pull request of their
# own, after the trusted-publishing run that publishes agent-adapt 0.19.1 and
# yaml-splice 0.3.2.
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Typed functions over the git command line: repository queries and a parsed status, commits and reverts limited to named paths, push to the upstream, cache clones, worktrees, and a command builder for everything else."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/osdlc/osdlc/tree/main/packages/rust/typed-git"
readme = "README.md"
keywords = ["git", "vcs", "worktree", "commit", "cli"]
categories = ["development-tools"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
log = "0.4.17"
thiserror = { workspace = true }
which = "8.0.2"

[dev-dependencies]
serial_test = "3.4.0"
tempfile = { workspace = true }

[lints]
workspace = true
