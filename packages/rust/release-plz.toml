# release-plz settings for the crates in this workspace.
# Reference: https://release-plz.dev/docs/config
#
# .github/workflows/release-plz.yml passes this file with the action's
# `config` input. release-plz only looks for it in the directory it runs in,
# which is the repository root.
[workspace]
# Tags are `<crate>/vX.Y.Z`. The release-plz default is `<crate>-vX.Y.Z`, or
# a bare `vX.Y.Z` while the workspace has one public crate. A bare `vX.Y.Z`
# is the sdlc CLI's own tag, so the template must stay set.
git_tag_name = "{{ package }}/v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
git_release_enable = true
# `release` runs on every push to main and publishes each crate whose
# version is not on crates.io yet. The `crates-io` environment approval
# gates each publish. This is the default, set here so it is not changed by
# accident.
release_always = true
# cargo-semver-checks on each release PR. A crate with no published version
# is not checked.
semver_check = true
changelog_update = true

# The wasm-bindgen wrapper is built into an npm package and never released as
# a crate. `publish = false` must match its Cargo.toml, or `release-plz
# release` stops with an error. It also keeps the crate out of the release
# pull request. `release = false` says the same explicitly: no version bump,
# changelog or tag.
[[package]]
name = "yaml-splice-wasm"
publish = false
release = false

# The wasm-bindgen wrapper over tradecraft-core, built for a future npm
# package. Never released as a crate.
[[package]]
name = "tradecraft-wasm"
publish = false
release = false

# A build tool that writes the TypeScript declarations for tradecraft-wasm.
# Never released as a crate.
[[package]]
name = "tradecraft-typegen"
publish = false
release = false

# First releases, held back in three steps; see the note in each Cargo.toml.
# `release = false` also stops a tag being cut for a version that was not
# published. packages/README.md lists the steps.
#
# Step 1: after the trusted-publishing run that publishes agent-adapt 0.19.1
# and yaml-splice 0.3.2. One run uses one credential.
[[package]]
name = "typed-git"
publish = false
release = false

[[package]]
name = "markdown-link"
publish = false
release = false

[[package]]
name = "markdown-vault-fs"
publish = false
release = false

# Step 2: needs step 1 and agent-adapt 0.19.1.
[[package]]
name = "markdown-relink"
publish = false
release = false

[[package]]
name = "tradecraft-core"
publish = false
release = false

# Step 3: needs step 2.
[[package]]
name = "tradecraft"
publish = false
release = false

# Held back until the parity fixes from the review of
# https://github.com/osdlc/osdlc/pull/460 land; see its Cargo.toml.
[[package]]
name = "markdown-contract"
publish = false
release = false
