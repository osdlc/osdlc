# The wasm-bindgen wrapper over tradecraft-core, for the npm package. Not
# published to crates.io. build.sh builds it for wasm32-unknown-unknown.
#
# A separate `cdylib` crate rather than a feature on the core, so wasm-bindgen
# stays out of every native build. It owns the `#[wasm_bindgen]` exports,
# `JsVfs` (the core's `Vfs` over a JS object), the JSON request and report
# boundary, and the error mapping.
[package]
name = "tradecraft-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "wasm-bindgen wrapper exposing tradecraft-core's publish, discovery, marketplace-export and adoption paths to JavaScript and TypeScript over WebAssembly, with the host filesystem supplied from JS."
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tradecraft-core = { workspace = true }
# Must equal the wasm-bindgen CLI version build.sh runs; the workspace pins it
# exactly.
wasm-bindgen = { workspace = true }
serde = { workspace = true }
# The request and the report cross as JSON strings, through the same derives
# the core carries.
serde_json = { workspace = true }
js-sys = { workspace = true }

[lints]
workspace = true
