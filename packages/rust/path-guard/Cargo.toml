[package]
name = "path-guard"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
description = "Path containment guard: reject hostile relative paths lexically, then prove the resolved path stays inside its root, following symlinks of whatever part of the path exists. Pluggable resolver for non-std filesystems."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["path", "security", "traversal", "symlink", "sandbox"]
categories = ["filesystem"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
thiserror = { workspace = true }

# tests/parity.rs only: it reads tests/fixtures/parity.json, the conformance
# fixture the TypeScript twin (packages/ts/path-guard) reads in place. The
# crate parses no JSON at runtime.
[dev-dependencies]
# 1.0.220 is the first serde that pins its own serde_derive, so the
# minimal-versions job does not resolve a newer serde_derive that fails to
# build against an older serde.
serde = { version = "1.0.220", features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
