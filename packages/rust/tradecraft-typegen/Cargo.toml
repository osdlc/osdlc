# The generator behind @osdlc/tradecraft-wasm's `core.generated.ts`.
#
# The TypeScript CLI reaches the core over a JSON string in and a JSON string
# out, so the TypeScript compiler checks nothing about the wire. This crate
# reads the Rust source that defines that wire and emits the TypeScript
# declarations for it. See README.md.
#
# A host-only build tool: it is not part of the shipped core or of the wasm
# artifact, and nothing depends on it.
[package]
name = "tradecraft-typegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Emits the TypeScript declarations for the tradecraft-wasm request and response types from the Rust source of tradecraft-core, tradecraft-wasm and agent-adapt."
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tradecraft-typegen"
path = "src/main.rs"

[dependencies]
syn = { workspace = true }
# `ToTokens`, for the token scans that read an export body.
quote = { workspace = true }

[lints]
workspace = true
