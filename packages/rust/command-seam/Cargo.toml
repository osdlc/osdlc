[package]
name = "command-seam"
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A seam for running child processes: a runner trait, a std::process runner with timeout and captured output, a checked form and a recording fake. The Rust twin of @osdlc/command-seam."
repository.workspace = true
homepage = "https://github.com/osdlc/osdlc/tree/main/packages/rust/command-seam"
readme = "README.md"
keywords = ["process", "command", "spawn", "testing", "seam"]
categories = ["os", "development-tools"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
thiserror = { workspace = true }
which = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event"] }
signal-hook = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
