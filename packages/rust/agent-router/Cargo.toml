[package]
name = "agent-router"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust twin of @osdlc/agent-router's pure core: references, the model catalogue, validity, effort, context and the profile walk. Checked against the JSON fixture vectors the TypeScript package emits."
license.workspace = true
repository.workspace = true
readme = "README.md"
# Unreleased: its tests read packages/ts/agent-router/fixtures, and no consumer
# needs it from crates.io yet (decision D-05 in the TypeScript package).
publish = false

[dependencies]
indexmap = { version = "2.14", features = ["serde"] }
regex = { workspace = true }
serde = { workspace = true }
# Profile order is the section's order; that needs serde_json's insertion-ordered map.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
url = "2.5"

[lints]
workspace = true
