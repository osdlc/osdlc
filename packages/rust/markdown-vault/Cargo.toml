[package]
name = "markdown-vault"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The vault model: every note and file, outgoing links and backlinks by kind, inline tags, frontmatter and each note's document tree, read through a Vfs and refreshed incrementally."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/osdlc/osdlc/tree/main/packages/rust/markdown-vault"
readme = "README.md"
keywords = ["markdown", "vault", "obsidian", "backlinks", "wikilink"]
categories = ["text-processing", "filesystem"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]

