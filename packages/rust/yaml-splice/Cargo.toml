[package]
name = "yaml-splice"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
description = "Edit top-level fields of a YAML mapping in place: set, remove and rename a key while every other byte, comments, key order and quoting included, stays as it was."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "frontmatter", "edit", "lossless", "comments"]
categories = ["parser-implementations", "text-processing", "encoding"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "tests/**/*.rs",
  "tests/fixtures/*.json",
  "tests/fixtures/real/*",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
saphyr-parser = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = ["serde_json"]
# `impl From<&serde_json::Value> for Value`. Nothing else uses serde_json.
serde_json = ["dep:serde_json"]

# Loads its JSON fixtures and builds `Set` values with the serde_json bridge.
[[test]]
name = "conformance"
required-features = ["serde_json"]

[[test]]
name = "nested_corpus"
required-features = ["serde_json"]

[[test]]
name = "fuzz_chars"
required-features = ["serde_json"]

[lints]
workspace = true
