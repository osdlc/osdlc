name: cursor-pr
description: >-
  Answers @cursor on a pull request with the Cursor CLI, or reviews the pull
  request with the craft code-review skill when the comment starts with
  "@cursor review". Runs any installed skill from "@cursor /<plugin>:<skill>"
  (read-only, or with --apply it commits and pushes the changes). Posts the
  result as a comment ending in a done or failed marker.
author: osdlc

inputs:
  cursor-api-key:
    description: >-
      Cursor API key, or several separated by spaces, commas or newlines; tried in
      order, moving on only after an authentication failure.
    required: true
  github-token:
    description: Token for gh (read the pull request, post the comment).
    default: ${{ github.token }}
  cursor-version:
    description: Cursor CLI version to install (agent-setup's pinned default).
    default: 2026.11.05-86047df
  cursor-sha256:
    description: >-
      SHA-256 of the Cursor CLI tarball; required when cursor-version is not
      the default.
    default: ""
  model:
    description: Model name for the CLI. Empty means the CLI's default.
    default: ""
  marketplaces:
    description: >-
      Plugin marketplaces, one per line, as `name=https-git-url` with an
      optional ` ref` (agent-setup's format). Cursor registers marketplaces but cannot install plugins.
    default: ""
  plugins:
    description: >-
      Plugins to install, plugin@marketplace, space or newline separated. Not supported on cursor; review mode inlines the craft code-review skill instead.
    default: ""

  push-token:
    description: >-
      Token used only to push the commit that "--apply" makes to the pull
      request branch (a GitHub App token, so CI runs on the push; the
      GITHUB_TOKEN does not start workflows). Never given to the agent. Empty:
      "--apply" is refused with a comment and everything else works.
    default: ""
  git-user-name:
    description: Author name of the "--apply" commit.
    default: github-actions[bot]
  git-user-email:
    description: Author email of the "--apply" commit.
    default: 41898282+github-actions[bot]@users.noreply.github.com

runs:
  using: composite
  steps:
    # The caller's `if` can only test for the text "@cursor"; this drops code
    # blocks, inline code and quoted lines, and the rest is skipped unless a
    # mention is left.
    - id: mention
      shell: bash
      env:
        AGENT: cursor
        REQUEST: ${{ github.event.comment.body || github.event.review.body }}
      run: '"$GITHUB_ACTION_PATH/../pr-common/mention.sh"'

    - if: steps.mention.outputs.real == '1'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}

    - if: steps.mention.outputs.real == '1'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: gh pr checkout "$PR"

    - if: steps.mention.outputs.real == '1'
      shell: bash
      env:
        HARNESS: cursor
        VERSION: ${{ inputs.cursor-version }}
        SHA256: ${{ inputs.cursor-sha256 }}
        MARKETPLACES: ${{ inputs.marketplaces }}
        PLUGINS: ${{ inputs.plugins }}
      run: '"$GITHUB_ACTION_PATH/../pr-common/install-agent.sh"'

    - if: steps.mention.outputs.real == '1'
      shell: bash
      env:
        AGENT: cursor
        HARNESS_SH: ${{ github.action_path }}/harness.sh
        HAS_PUSH_TOKEN: ${{ inputs.push-token != '' }}
        KEY_VAR: CURSOR_API_KEY
        GH_TOKEN: ${{ inputs.github-token }}
        KEYS: ${{ inputs.cursor-api-key }}
        MODEL: ${{ inputs.model }}
        MODE: ${{ steps.mention.outputs.mode }}
        RESULT: ${{ runner.temp }}/cursor-pr-result.json
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        REQUEST: ${{ github.event.comment.body || github.event.review.body }}
        SOURCE_URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
      run: '"$GITHUB_ACTION_PATH/../pr-common/ask.sh"'

    # --apply: the action, not the agent, commits and pushes. The push token is
    # only in this step's environment, never in the agent's.
    - if: steps.mention.outputs.real == '1' && steps.mention.outputs.mode == 'skill' && steps.mention.outputs.apply == '1'
      shell: bash
      env:
        AGENT: cursor
        GH_TOKEN: ${{ inputs.github-token }}
        PUSH_TOKEN: ${{ inputs.push-token }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        RESULT: ${{ runner.temp }}/cursor-pr-result.json
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        REQUEST: ${{ github.event.comment.body || github.event.review.body }}
      run: '"$GITHUB_ACTION_PATH/../pr-common/apply.sh" push'

    - if: always() && steps.mention.outputs.real == '1'
      shell: bash
      env:
        AGENT: cursor
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        MODE: ${{ steps.mention.outputs.mode }}
        REQUEST: ${{ github.event.comment.body || github.event.review.body }}
        RESULT: ${{ runner.temp }}/cursor-pr-result.json
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: '"$GITHUB_ACTION_PATH/../pr-common/post.sh"'
