# The workspace is the TypeScript packages, packages/ts/*, the corpus-schema
# profiles and corpora, packages/profiles/* and packages/corpora/*, and the
# Markdown Ecosystem Plan's explorer, tools/explorer, which is private and reads
# the plan with packages/ts/corpus-schema. The profiles and corpora hold
# Markdown and JSON Schema and no code. packages/corpora/harness-reference/site
# is private too: the harness reference as a static site, built with
# packages/ts/corpus-site. The example pair under
# packages/corpora/examples/ is not a member: fernlog installs the claims
# profile on its own, as a consumer would. The plugin packs under
# .claude-plugin/, .agents/, .cursor-plugin/ and .pi/ install on their own, and
# so does site/.
packages:
  - 'packages/ts/*'
  - 'packages/profiles/*'
  - 'packages/corpora/*'
  - 'packages/corpora/harness-reference/site'
  - 'tools/explorer'

# Third-party versions shared by more than one package, and the dev tooling
# every package uses. A package or the root names one as `"catalog:"` so a bump
# is one edit here. `pnpm pack` and `pnpm publish` rewrite `catalog:` and
# `workspace:` to concrete ranges in the packed package.json. A peer range
# (`zod: ^4`) is a compatibility statement, so it stays literal.
# check:packages (@osdlc/package-checks) fails a package that lists one of these
# with its own version.
catalog:
  '@modelcontextprotocol/sdk': ^1.32.2
  '@types/node': ^26.1.0
  '@types/semver': ^7.7.1
  '@vitest/coverage-v8': ^5.0.5
  oxlint: ^1.65.0
  prettier: 3.9.6
  typescript: ~6.0.3
  vitest: ^5.0.5
  yaml: ^2.9.0
  zod: ^4.6.6
  semver: ^7.8.5
  '@arethetypeswrong/cli': 0.18.5
  '@changesets/cli': 3.0.3
  publint: 0.3.24
  smol-toml: ^1.7.0

# Dependencies whose install scripts pnpm runs. vue-demi, under the explorer's
# @vue-flow packages, picks its Vue 3 build at install.
onlyBuiltDependencies:
  - vue-demi
